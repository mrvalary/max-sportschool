ion-head"><h2>Ближайшие мероприятия</h2>${link('events','Все события','btn ghost')}</div><div class="list">${currentEvents().slice(0,3).map(eventCard).join('')||empty('Новые даты уточняются','Откройте календарь нужного отдела.')}</div><p class="source">Перед посещением подтвердите дату и место у организатора.</p>`;}

function field(name,label,values,current='',emptyLabel='Все'){return `<div class="field"><label for="f-${name}">${esc(label)}</label><select id="f-${name}" data-filter="${name}"><option value="">${emptyLabel}</option>${values.map(v=>{let [value,title]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(title)}</option>`;}).join('')}</select></div>`;}

function catalog(forceDept){let dep=forceDept||params.get('dept')||'',q=params.get('q')||'',cat=params.get('category')||'',city=params.get('city')||'',age=params.get('age')||'';

 return `${!forceDept?head('Подобрать занятия','Выберите направление, город и возраст. Условия записи уточните у специалиста выбранного подразделения.'):''}<div class="toolbar">${filterSearch(q)}${!forceDept?field('dept','Цель / направление',[['resource','Здоровье и оздоровление'],['sport','Спортивная подготовка'],['mustang','Верховая езда'],['veterans','Участники СВО']],dep):''}${field('category','Категория',categoryOptions(['ЛИН','ПОДА','Нарушение слуха','Нарушение зрения','ЦП']),cat)}${field('city','Город',['Хабаровск','Комсомольск-на-Амуре','Бикин','Советская Гавань','Пивань','Амурск','Ванино'],city)}<div class="field"><label for="f-age">Возраст участника</label><input id="f-age" type="number" min="0" max="110" data-filter="age" placeholder="Лет" value="${esc(age)}"></div></div><p class="result-count">Найдено вариантов занятий: ${list.length}. Один вид спорта может быть представлен у нескольких тренеров и на разных площадках.</p>${age?notice('Возрастной фильтр учитывает только опубликованный минимум. Для отдельных категорий требования отличаются; откройте карточку.'):''}<div class="grid">${list.slice(0,pageNo*30).map(activityCard).join('')}</div>${!list.length?empty('Занятия по этим фильтрам не найдены','Измените фильтры или обратитесь в Ресурсный центр.'):''}${list.length>pageNo*30?'<div class="row" style="margin-top:20px"><button class="btn secondary" data-more>Показать ещё</button></div>':''}${dep==='resource'?`<div class="row" style="margin-top:20px">${link('admission?dept=resource','Сначала пробные занятия — как начать','btn','arrow')}</div>`:dep==='veterans'?notice('Информация о группах для ветеранов приведена в расписании. Условия посещения уточните у специалиста.'):''}${sourceLine(dep==='sport'?dept('sport').source:dep==='veterans'?dept('veterans').source:dept('resource').source)}`;
}
function activityDescription(a){if(!a.trainer)return `<p>${esc(a.description)}</p>`;const address=a.address||'',venue=a.venue||'';const readableAddress=address.replace(/ (ул\.|Амурский бульвар)/g,'; $1');return `<div class="activity-details-text"><p><strong>Тренер:</strong> ${esc(a.trainer)}</p>${venue?`<p><strong>Место занятий:</strong> ${esc(venue)}</p>`:''}${address&&address!==venue?`<p><strong>${readableAddress.includes(';')?'Адреса':'Адрес'}:</strong> ${esc(readableAddress)}</p>`:''}</div>`;}
function activityCard(a){return `<article class="card"><div class="type">${esc(a.type)}</div>${saveButton(a.id)}<h3>${esc(activityName(a.name))}</h3><div class="tags">${a.categories.map(x=>tag(categoryLabel(x))).join('')}${a.dept==='resource'&&a.name==='Настольный теннис'?tag('С 8 или 18 лет — зависит от категории'):a.dept==='resource'&&a.name==='Плавание'?tag('С 7 лет; отдельные группы — с 18 лет'):a.minAge?tag('от '+a.minAge+' лет','teal'):tag('Возраст уточните у специалиста')}</div>${activityDescription(a)}<div class="meta">${ic('pin')}${esc(a.city)}</div><div class="row"><button class="btn secondary small" data-activity="${a.id}">Подробнее</button>${link('schedule?dept='+a.dept+'&q='+encodeURIComponent(a.trainer||({r2:'конный',r3:'футбол',r12:'бокс'}[a.id]||a.name)),'Расписание','btn ghost')}</div></article>`;}
function showActivity(id){const a=D.activities.find(x=>x.id===id),d=dept(a.dept);modal(`<span class="eyebrow">${esc(d.name)}</span><h2>${esc(activityName(a.name))}</h2><div class="tags">${a.categories.map(x=>tag(categoryLabel(x))).join('')}</div>${activityDescription(a)}<p class="smalltext">${esc(a.city)} · ${a.minAge?'Минимальный возраст: '+a.minAge+' лет.':'Возраст для записи уточните у специалиста.'}</p>${a.name==='Настольный теннис'&&a.dept==='resource'?notice('Для лиц с нарушением слуха — с 8 лет; с нарушением зрения и ПОДА — с 18 лет.'):''}${a.name==='Плавание'&&a.dept==='resource'?notice('На сайте отдельно приведены группы с 7 лет и взрослые группы с 18 лет. Конкретную группу подбирает специалист.'):''}<div class="row">${link('schedule?dept='+a.dept+'&q='+encodeURIComponent(a.trainer||({r2:'конный',r3:'футбол',r12:'бокс'}[a.id]||a.name)),'Посмотреть расписание','btn','calendar')}${a.dept==='veterans'?link('dept/veterans?tab=about','Условия поддержки','btn secondary'):`<button class="btn secondary" data-checklist="${a.dept}">Порядок и документы</button>`}</div><div class="panel" style="margin-top:18px"><h3>Обсудить занятия со специалистом</h3><a class="contact-link" href="tel:${d.phone.replace(/[^+\d]/g,'')}">${esc(d.phone)}</a><p>${esc(d.address)}</p></div>${sourceLine(a.source)}${a.ageSource?sourceLine(a.ageSource):''}`);}
function eventCard(e){const start=e.start?new Date(e.start+'T12:00:00'):null;let day=start?start.getDate():'↗',mon=start?start.toLocaleDateString('ru-RU',{month:'short'}):'календарь';let old=e.end&&e.end<dayNow();return `<article class="event"><div class="date-badge"><strong>${day}</strong>${esc(mon.replace('.',''))}</div><div class="event-body"><h3><button class="btn ghost" style="font-size:inherit;text-align:left;padding:0;color:var(--ink);display:block" data-event="${e.id}">${esc(e.title)}</button></h3><div class="meta">${ic('calendar')}${esc(e.dateLabel)}</div><div class="meta">${ic('pin')}${esc(e.place)}</div><div class="tags">${tag(deptName(e.ownerDept||e.depts[0]),'teal')}${e.status==='results'?tag('Есть протокол','result'):old?tag('Дата по плану уже прошла'):tag('По календарному плану')}${e.dateConflict?tag('Даты требуют уточнения','warn'):''}</div></div>${saveButton(e.id)}</article>`;}
function allEvents(){let list=D.events.map(x=>({...x}));const f=feeds.gtoCalendar;if(f?.live&&f.tables.length){const tb=new DOMParser().parseFromString(f.tables[0],'text/html').querySelector('table');if(tb){const rows=[...tb.rows].map(r=>[...r.cells].map(c=>c.textContent.trim())).filter(r=>r.length>=5&&/^\d+$/.test(r[0]));list=list.filter(x=>!/^g\d+$/.test(x.id));for(const r of rows){const original=D.events.find(x=>x.id==='g'+r[0]),dates=parseRussianDate(r[3]);list.push({...original,id:'g'+r[0],title:r[1],dateLabel:r[3]+' 2026',place:r[4],start:dates[0],end:dates[1],depts:['gto'],ownerDept:'gto',documentIds:original?.documentIds||[],categories:original?.categories||['Все категории'],source:f.url,status:'plan',description:r[2]});}}}return list;}

function parseRussianDate(s){let y=(s.match(/20\d{2}/)||['2026'])[0],months=['январ','феврал','март','апрел','мая','июн','июл','август','сентябр','октябр','ноябр','декабр'];let raw=s.replace(/20\d{2}/g,'');let nums=[...raw.matchAll(/\d+/g)].map(x=>Number(x[0])).filter(x=>x<=31&&x>0),ms=[];for(let m=0;m<12;m++)if(raw.toLowerCase().includes(months[m]))ms.push([raw.toLowerCase().indexOf(months[m]),m+1]);ms.sort((a,b)=>a[0]-b[0]);if(!nums.length||!ms.length)return ['',''];let fmt=(d,m)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return [fmt(nums[0],ms[0][1]),fmt(nums[1]||nums[0],ms.at(-1)[1])];}
function eventsView(forceDept){const dep=forceDept||params.get('dept')||'',when=params.get('when')||'upcoming',q=params.get('q')||'';const list=allEvents().filter(e=>(!dep||e.ownerDept===dep)&&(!q||match(JSON.stringify(e),q))&&(when==='all'||when==='past'&&e.end&&e.end<dayNow()||when==='upcoming'&&(e.end>=dayNow()||!e.start))).sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'));return `${!forceDept?head('Мероприятия по отделам','Выберите подразделение, чтобы посмотреть его мероприятия, календарный план, положения и результаты.'):''}<div class="toolbar">${filterSearch(q,'Название события или вид спорта')}${!forceDept?field('dept','Подразделение / направление',D.departments.map(d=>[d.id,d.name]),dep):''}${field('when','Период',[['upcoming','Ближайшие'],['past','Прошедшие'],['all','Все опубликованные']],when,'Выбрать')}</div>${dep?participationPanel(dep,true):`<div class="row" style="margin-bottom:18px">${link('dept/events?tab=events','Соревнования школы','btn secondary small')}${link('dept/gto?tab=events','Мероприятия ГТО','btn secondary small')}</div>`}<p class="result-count">Найдено мероприятий: ${list.length}. Полные календарные планы и изменения к ним доступны ниже.</p><div class="list">${list.map(eventCard).join('')||empty('В этом списке пока нет мероприятий',dep?'Посмотрите календарный план или уточните информацию у организатора.':'Измените период или выберите организатора.')}</div>${!forceDept?calendarOriginals(dep||'all'):''}`;}

function showEvent(id){const e=allEvents().find(x=>x.id===id);if(!e)return;const owner=e.ownerDept||e.depts[0],docs=allDocs().filter(d=>(e.documentIds||[]).includes(d.id));modal(`<span class="eyebrow">${esc(deptName(owner))}</span><h2>${esc(e.title)}</h2><p>${ic('calendar')} ${esc(e.dateLabel)}</p><p>${ic('pin')} ${esc(e.place)}</p><div class="tags">${e.categories.map(x=>tag(categoryLabel(x))).join('')}</div><p>${esc(e.description||'')}</p>${e.dateConflict?notice('В источниках расходятся даты. Подтвердите дату у своего отдела.','warn'):''}${participationPanel(owner,false,e.title)}<div class="section-head"><h2>Материалы этого события</h2></div><div class="list">${docs.map(docRow).join('')}</div>${!docs.some(x=>x.kind==='Положение')?notice('Положение не добавлено в приложение. Его можно запросить у организатора.'):''}<div class="row" style="margin-top:16px">${ext(e.source,'Страница публикации')}<button class="btn secondary small" data-ics="${e.id}">Добавить дату в календарь</button></div>`);}

function deptView(id){const d=dept(id);if(!d)return empty('Раздел не найден');const tab=params.get('tab')||'about',isEvents=id==='events',isGto=id==='gto';const tabs=isEvents?[['about','Обзор'],['events','Мероприятия'],['plan','Календарный план'],['rules','Положения'],['results','Протоколы'],['contact','Как участвовать']]:[['about','Обзор'],['classes',isGto?'Как участвовать':'Занятия и услуги'],['schedule',isGto?'Календарь ГТО':'Расписание'],['events','Мероприятия'],['venues','Площадки'],['docs','Документы'],['contact','Контакты']];let content='';if(tab==='about')content=`${isGto?gtoIntro():''}<div class="split"><section class="panel"><h2>Чем можем помочь</h2><ul class="service-list">${d.services.map(t=>`<li>${ic('check')}<span>${esc(t)}</span></li>`).join('')}</ul><div class="row">${id==='resource'?link('admission?dept=resource','Пробные занятия и документы','btn','arrow'):id==='sport'?link('admission?dept=sport','Как записаться','btn','trophy'):link('dept/'+id+'?tab='+('events'===id?'plan':'classes'),isEvents?'Открыть план':isGto?'Как участвовать':'Выбрать услугу','btn','arrow')}${!isEvents?link('dept/'+id+'?tab=schedule',isGto?'Календарь ГТО':'Расписание','btn secondary','calendar'):link('dept/events?tab=results','Протоколы','btn secondary','file')}</div>${id==='sport'?notice('Цель отдела — развитие спортсменов, подготовка спортивного резерва и спортсменов высокого класса. Тренер поможет выбрать вид спорта и подходящую группу.','success'):''}${id==='resource'?admissionSteps('resource',true):''}</section><aside>${contactPanel(d)}</aside></div>${sourceLine(d.source)}`;

function gtoIntro(){return `<section class="panel gto-intro" aria-labelledby="gto-intro-title"><span class="eyebrow">Хочу участвовать</span><h2 id="gto-intro-title">Пройти ГТО</h2><p>ГТО — «Готов к труду и обороне»: испытания для проверки физической подготовки и получения знака отличия при выполнении нормативов. В школе работает региональный центр ГТО для людей с инвалидностью и ограниченными возможностями здоровья.</p><p>Здесь помогут разобраться с адаптированными испытаниями, подходящими нормативами и участием в фестивалях и акциях ГТО. Условия зависят от возраста и категории участника.</p><h3>С чего начать</h3><ol class="steps-text"><li>Посмотрите нормативы и календарь ГТО.</li><li>Свяжитесь с центром: сообщите возраст, категорию участника и интересующее испытание или мероприятие.</li><li>Уточните порядок регистрации, необходимые документы и условия допуска. Согласуйте дату и место участия.</li></ol><div class="row">${link('dept/gto?tab=classes','Нормативы и порядок участия','btn','arrow')}${link('dept/gto?tab=events','Мероприятия ГТО','btn secondary','calendar')}<a class="btn secondary" href="tel:${dept('gto').phone.replace(/[^+\d]/g,'')}">${ic('phone')} Связаться с центром ГТО</a></div></section>`;}
function gtoGuide(){const norms=D.documents.filter(x=>x.kind==='Нормативы'&&x.format!=='САЙТ');return `<div class="panel"><h2>Начните с официальных источников ГТО</h2><p>Правовые документы и нормативы — на официальном сайте ВФСК ГТО. Календарь и связь с региональным центром — в этом разделе.</p><div class="grid two">${D.gtoOfficial.map(x=>`<a class="task" href="${esc(x.url)}" target="_blank" rel="noopener">${ic('external')}<span>${esc(x.title)}<small>${esc(x.description)} · gto.ru</small></span></a>`).join('')}</div></div><div class="section-head"><h2>Порядок участия</h2></div>${participationPanel('gto')}<div class="row">${ext('https://kski.ru/content/podrazdeleniya/vfsk-gto/registraciya-rebyonka-na-sajte-gto/','Инструкция регистрации ребёнка')}${link('dept/gto?tab=events','Календарь центра ГТО','btn secondary')}</div><div class="section-head"><h2>Материалы регионального центра</h2></div><p class="smalltext">Ниже — копии нормативов, опубликованные школой. Актуальную редакцию проверяйте по официальным ссылкам выше.</p><div class="list">${norms.map(docRow).join('')}</div>`;}

function contactPanel(d){return `<div class="panel"><h3>${esc(d.contactName||d.name)}</h3><a class="contact-link" href="tel:${d.phone.replace(/[^\d+]/g,'')}">${esc(d.phone)}</a>${d.phone2?`<a class="smalltext" href="tel:${d.phone2.replace(/[^\d+]/g,'')}">${esc(d.phone2)}</a>`:''}<p>${d.id==='mustang'?'Место занятий: ':''}${esc(d.address)}</p>${d.officeAddress?`<p>Администрация клуба: ${esc(d.officeAddress)}</p>`:''}${d.consultationAddress?`<h4>Демонстрационно-просветительский центр</h4><p>${esc(d.consultationAddress)}</p><a class="contact-link" href="tel:${d.consultationPhone.replace(/[^+\d]/g,'')}">${esc(d.consultationPhone)}</a>`:''}${d.email?`<p><a href="mailto:${esc(d.email)}">${esc(d.email)}</a></p>`:''}<p class="smalltext">${d.id==='mustang'?'Время посещения и занятий согласуйте с клубом.':d.id==='veterans'?'Время консультации в демонстрационно-просветительском центре согласуйте по телефону.':esc(D.officeHours)+' · время Хабаровска'}</p><div class="row">${mapLinks(d.address)}${d.officeAddress?mapLinks(d.officeAddress,'','Администрация на карте'):''}${d.consultationAddress?mapLinks(d.consultationAddress,'','Центр на карте'):''}${ext(D.contactsSource,'На сайте школы')}</div></div>`;}

function mapAddresses(address){const text=String(address||'').replace(/\s+/g,' ').trim();const starts=[...text.matchAll(/ул\.|улица\s|пер\.|переулок\s|Амурский\s+(?:бульвар|б-р)|[Бб]ульвар Юности|[Пп]роспект Победы|[Пп]роспект\s+Московский|Московский пр-кт|пр\.\s*Победы/gi)].map(m=>m.index);const clean=value=>value.split(/[()]/)[0].replace(/,?\s*каб\.?[\s\S]*$/i,'').replace(/^[\s,(]+|[\s,;(]+$/g,'').trim();return [...new Set((starts.length?starts.map((at,i)=>clean(text.slice(at,starts[i+1]??text.length))):[clean(text)]).filter(Boolean))];}
function mapCity(address,city=''){return city||String(address).match(/^(?:г\.\s*)?(Хабаровск|Комсомольск-на-Амуре|Бикин|Амурск|Ванино|Советская Гавань)/i)?.[1]||'';}
function mapUrl(address,city=''){const target=mapAddresses(address)[0]||String(address).trim();return 'https://yandex.ru/maps/?text='+encodeURIComponent([mapCity(address,city),target].filter(Boolean).join(', '));}
function mapLinks(address,city='',label='Открыть на карте'){const places=mapAddresses(address),town=mapCity(address,city);return places.map((place,i)=>ext(mapUrl(place,town),places.length>1?'Адрес '+(i+1)+' на карте':label)).join('');}
function decorateContactLinks(root){root.querySelectorAll('a[href^="tel:"],a[href^="mailto:"]').forEach(anchor=>{if(anchor.dataset.contactEnhanced)return;anchor.dataset.contactEnhanced='1';const value=decodeURIComponent(anchor.getAttribute('href').replace(/^(?:tel:|mailto:)/,'').split('?')[0]);const button=document.createElement('button');button.type='button';button.className='btn ghost contact-copy';button.dataset.copy=value;button.textContent='Скопировать';button.setAttribute('aria-label',(anchor.getAttribute('href').startsWith('tel:')?'Скопировать телефон ':'Скопировать почту ')+value);anchor.after(button);});}

function venueCard(v){return `<article class="card"><div class="venue-map">${ic('pin')}</div>${saveButton(v.id)}<h3>${esc(v.name)}</h3><p>${esc(v.city)}, ${esc(v.address)}</p><div class="tags">${v.sports.map(s=>tag(s)).join('')}</div><p class="smalltext">Условия доступности входа и сопровождения уточните у специалиста перед посещением.</p><div class="row">${mapLinks(v.address,v.city)}${link('schedule?q='+encodeURIComponent(v.address.split(',')[0]),'Расписание','btn ghost')}</div>${sourceLine(v.source)}</article>`;}
function venuesView(forceDept){let q=params.get('q')||'',list=D.venues.filter(v=>(!q||match(JSON.stringify(v),q))&&(!forceDept||v.depts.includes(forceDept)||forceDept==='mustang'&&v.name.includes('Мустанг')||forceDept==='resource'&&v.id==='office'));return `${!forceDept?head('Где проходят занятия','Площадки из реестра тренеров школы. Для физкультурно-оздоровительных групп адрес также указан в их расписании.'):''}<div class="toolbar">${filterSearch(q,'Площадка, адрес или вид спорта')}</div>${forceDept==='gto'?notice('Постоянное место всех испытаний ГТО на сайте не задано. Площадка зависит от мероприятия; точный адрес сообщает центр.'):''}${forceDept==='resource'?notice('Площадки физкультурно-оздоровительных групп взяты из расписания Ресурсного центра. У одного объекта могут быть несколько групп и инструкторов.'):''}<p class="result-count">Площадок: ${list.length}</p><div class="grid two">${list.map(venueCard).join('')||empty('Уточните площадку у отдела','Адрес конкретного мероприятия или занятия приведён в расписании и положении.')}</div>`;}
let dataRevision=0,docsRevision=-1,docsCache=[],docsByUrl=new Map();
const sourceMemo=new WeakMap();
function sourceCached(source,key,build){let cached=sourceMemo.get(source);if(!cached){cached=new Map();sourceMemo.set(source,cached);}if(!cached.has(key))cached.set(key,build());return cached.get(key);}
function allDocs(){if(docsRevision===dataRevision)return docsCache;let docs=D.documents.filter(x=>!Object.values(feeds).some(f=>f.live&&f.url===x.source&&!f.files.some(item=>item.url===x.url))).map(x=>({...x}));const byUrl=new Map(docs.map(d=>[d.url,d]));for(const [key,f] of Object.entries(feeds)){if(!f.live)continue;const owner=D.feedOwners[key]||'events',kind=key.includes('Results')?'Протокол':key.includes('Rules')||key==='rules2026'?'Положение':key.includes('Calendar')?'Календарь':'Расписание';for(const x of f.files){const exists=byUrl.get(x.url);if(exists){exists.title=x.title;exists.source=f.url;if(owner==='gto'){exists.dept='gto';exists.owners=['gto'];}}else{const added={...x,id:'live-'+key+'-'+docs.length,dept:owner,owners:key==='sportSchedule'?['sport','resource']:[owner],kind,source:f.url};docs.push(added);byUrl.set(x.url,added);}}}docsCache=docs;docsByUrl=byUrl;docsRevision=dataRevision;return docs;}

function docRow(d){allDocs();const indexed=docsByUrl.get(d.url);d={...indexed,...d};if(!d.id)d.id='url-'+encodeURIComponent(d.url);const owners=d.owners||[d.dept||'events'],owner=owners[0],participate=['Календарь','Положение','Протокол'].includes(d.kind);return `<article class="docrow"><span class="docicon">${esc(d.format||'ФАЙЛ')}</span><div class="docbody"><h3>${esc(d.title)}</h3><div class="tags">${tag(d.kind||'Документ')}${tag(owners.map(deptName).join(' · '))}</div><div class="source">${ext(d.source,'Страница публикации','')}</div></div>${ext(d.local||d.url,d.local?'Открыть копию':'Открыть файл')}${saveButton(d.id)}${participate?`<div class="doc-contact"><a href="tel:${dept(owner).phone.replace(/[^\d+]/g,'')}">${ic('phone')} ${esc(dept(owner).phone)}</a><button class="btn ghost" data-participate="${owner}">Как участвовать →</button></div>`:''}</article>`;}

function documentsView(forceDept,forceKind){const q=params.get('q')||'',kind=forceKind||params.get('kind')||'',dep=forceDept||params.get('dept')||'';const list=allDocs().filter(d=>(!q||match(JSON.stringify(d),q))&&(!kind||d.kind===kind)&&(!dep||(d.owners||[d.dept]).includes(dep)));return `${!forceDept?head('Результаты и документы','Материалы разделены по отделу и типу. У каждого файла указан его источник.'):''}<div class="toolbar">${filterSearch(q,'Соревнование или название файла')}${!forceKind?field('kind','Тип документа',['Протокол','Положение','Календарь','Нормативы','Правовые акты','Награждение','Расписание','Бланк','Программа','Услуги','Инструкция'],kind):''}${!forceDept?field('dept','Подразделение / направление',D.departments.map(d=>[d.id,d.name]),dep):''}</div>${dep&&['events','gto'].includes(dep)&&(!kind||['Календарь','Положение','Протокол'].includes(kind))?participationPanel(dep,true):''}<p class="result-count">Файлов: ${list.length}. ${dep?'Материалы выбранного отдела.':'Выберите отдел, чтобы увидеть его материалы.'}</p><div class="list">${list.slice(0,pageNo*25).map(docRow).join('')||empty('Материалы не выделены отдельной публикацией','Свяжитесь со своим отделом для уточнения.')}</div>${list.length>pageNo*25?'<div style="margin-top:20px"><button class="btn secondary" data-more>Показать ещё</button></div>':''}`;}

function expandTable(table){let result=[],spans=new Map();[...table.rows].forEach((row,r)=>{let cols=[],c=0;[...row.cells].forEach(cell=>{while(spans.has(r+','+c)){cols[c]=spans.get(r+','+c);c++;}let text=cell.innerText??cell.textContent;let v=text.replace(/\s+/g,' ').trim();let cs=cell.colSpan||1,rs=cell.rowSpan||1;for(let cc=0;cc<cs;cc++){cols[c]=v;for(let rr=1;rr<rs;rr++)spans.set((r+rr)+','+c,v);c++;}});while(spans.has(r+','+c)){cols[c]=spans.get(r+','+c);c++;}result.push(cols);});return result;}
function slots(){return sourceCached(feeds.resourceSchedule,'resource',()=>{let out=[],sport='',city='Хабаровск';feeds.resourceSchedule.tables.forEach((html,ti)=>{let t=new DOMParser().parseFromString(html,'text/html').querySelector('table');if(!t)return;let rows=expandTable(t);if(ti===1)city='Комсомольск-на-Амуре';for(let r of rows){let uniq=[...new Set(r.filter(Boolean))];if(uniq.length===1){let s=uniq[0];if(s.startsWith('г.'))city=s.replace('г. ','');else if(s.startsWith('БИКИН')||s.includes('Бикин'))city='Бикин';else sport=s;continue;}if(r.length>=11&&r[1]&&!r[1].toLowerCase().includes('тренер')){let s=ti===0?sport:r[3].split('(')[0].trim();let times=r.slice(4,11);out.push({sport:s,trainer:r[1],venue:r[2],category:r[3],times,city});}}});return out;});}

const requestedSources=new Set();let sourceLoading=false;
function sourceDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'дата не указана':date.toLocaleString('ru-RU',{timeZone:'Asia/Vladivostok'});}
function feedStatus(key){const f=feeds[key];if(!f)return '';return `<div class="feedbar"><span role="status">${sourceLoading?'Проверяю обновления…':f.snapshot?'Сохранённая копия · '+D.checkedDate:'Данные с сайта · '+sourceDate(f.fetchedAt)}${f.lastError?' · не удалось получить обновление; показаны последние сохранённые данные':''}</span><button type="button" class="btn secondary small" data-sync="${key}">Проверить обновления</button></div>`;}
function sourceKeys(){const d=route.startsWith('dept/')?dept(route.split('/')[1]):null,tab=params.get('tab')||'about';if(route==='sources')return [];if(route==='schedule'||d&&tab==='schedule')return [(d||dept(params.get('dept')||'resource')).schedule].filter(Boolean);if(route==='jobs')return ['jobs'];if(route==='about')return ['organization'];if(d){if(tab==='docs'||tab==='rules'||tab==='results')return d.id==='gto'?['gtoRules','gtoResults']:d.id==='veterans'?['veteransCalendar']:['rules2026','regionResults','schoolResults','festivalResults'];if(tab==='events'||tab==='plan')return d.id==='gto'?['gtoCalendar']:d.id==='veterans'?['veteransCalendar']:['schoolCalendar','regionCalendar'];return [];}if(route==='documents'||route==='search')return ['gtoRules','gtoResults','rules2026','regionResults','schoolResults','festivalResults'];if(route==='events')return ['schoolCalendar','regionCalendar','gtoCalendar','veteransCalendar'];return [];}
async function readSourceJson(path){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(path,{cache:'no-cache',signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timer);}}
let sourceCachePending=false;
function persistSourceCache(){if(sourceCachePending)return;sourceCachePending=true;const write=()=>{sourceCachePending=false;try{const value=JSON.stringify({version:3,feeds,checked:sourceChecked});if(localStorage.getItem('kski-feeds')!==value)localStorage.setItem('kski-feeds',value);}catch{}};if('requestIdleCallback' in window)window.requestIdleCallback(write,{timeout:1500});else setTimeout(write,0);}
async function sync(key,quiet=false){const keys=key==='all'?Object.keys(feeds):Array.isArray(key)?key:[key];if(sourceLoading)return;sourceLoading=true;try{await Promise.all(keys.map(async k=>{try{const next=await readSourceJson('data/feeds/'+encodeURIComponent(k)+'.json');if(next.key!==k||!Array.isArray(next.tables)||!Array.isArray(next.files))throw Error('Invalid source');feeds[k]=next;dataRevision++;sourceChecked[k]=Date.now();delete syncErrors[k];}catch(e){syncErrors[k]=true;}}));if(keys.includes('sportSchedule')){try{const next=await readSourceJson('data/sport-schedule.json');if(!Array.isArray(next.rows)||!next.rows.length)throw Error('Invalid schedule');sportScheduleData=next;localStorage.setItem('kski-sport-table',JSON.stringify(next));}catch(e){}}persistSourceCache();}finally{sourceLoading=false;const y=window.scrollY;render();window.scrollTo(0,y);if(!quiet)toast(keys.some(k=>syncErrors[k]||feeds[k]?.lastError)?'Часть источников недоступна. Сохранённые сведения оставлены.':'Загружены последние опубликованные копии источников.');}}
function ensureSources(){if(sourceLoading)return;const keys=sourceKeys().filter(k=>!requestedSources.has(k)&&(!sourceChecked[k]||Date.now()-sourceChecked[k]>15*60*1000||feeds[k]?.lastError));keys.forEach(k=>requestedSources.add(k));if(keys.length)sync(keys,true);}
try{const cached=JSON.parse(localStorage.getItem('kski-sport-table')||'null');if(cached?.rows?.length)sportScheduleData=cached;}catch{}

function oldFeedStatus(key){const f=feeds[key];return `<div class="feedbar"><span>Сохранённые сведения · ${esc(D.checkedDate)}</span>${ext(f.url,"Проверить на сайте школы")} </div>`;}
const weekNames=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const shortDays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const scheduleNorm=s=>String(s||'').replace(/\s+/g,' ').trim();
function timeParts(value){let text=scheduleNorm(value).replace(/(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})/g,(_,a,b,c,d)=>a.padStart(2,'0')+':'+b+'–'+c.padStart(2,'0')+':'+d);return text.split(/[,;]\s*|\s+(?=\d{2}:\d{2}–)/).map(scheduleNorm).filter(Boolean);}
function sportScheduleSlots(){return sourceCached(sportScheduleData,'sport',()=>{return sportScheduleData.rows.map(row=>{const times=Array.from({length:7},()=>[]),notes=[];let label='';const tokens=[...row.time.matchAll(/Плавательные дорожки:|Сухой зал:|Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье|По индивидуальн[^.]*/g)];for(let i=0;i<tokens.length;i++){const token=tokens[i][0],body=row.time.slice(tokens[i].index+token.length,tokens[i+1]?.index??row.time.length).trim();if(token.endsWith(':')){label=token.slice(0,-1);continue;}const day=weekNames.indexOf(token);if(day>=0)times[day].push(...timeParts(body).map(t=>t+(label?' · '+label:'')));else notes.push(token);}if(!tokens.length)notes.push(row.time);return {...row,times,notes,source:sportScheduleData.source};});});}
function mustangScheduleSlots(){return sourceCached(feeds.mustangSchedule,'mustang',()=>{const out=[];for(const markup of feeds.mustangSchedule.tables){const table=new DOMParser().parseFromString(markup,'text/html').querySelector('table');if(!table)continue;let sport='';for(const row of expandTable(table)){const values=[...new Set(row.filter(Boolean))];if(values.length===1){sport=values[0];continue;}if(row.length>=7&&/^\d/.test(row[0])&&row[1])out.push({sport,trainer:row[1],venue:row[2],city:'Хабаровск',category:'',stage:'',times:[...row.slice(3,7),'','',''],source:feeds.mustangSchedule.url});}}return out;});}
function groupedSchedule(rows){return sourceCached(rows,'grouped',()=>{const cards=new Map();for(const row of rows){const key=[row.sport,row.trainer,row.venue,row.city].map(x=>scheduleNorm(x).toLocaleLowerCase('ru')).join('|');if(!cards.has(key))cards.set(key,{...row,groups:new Map()});const card=cards.get(key),groupKey=[row.category,row.stage].map(scheduleNorm).join('|');if(!card.groups.has(groupKey))card.groups.set(groupKey,{category:row.category||'',stage:row.stage||'',times:Array.from({length:7},()=>new Set()),notes:new Set()});const group=card.groups.get(groupKey);(row.times||[]).forEach((value,i)=>{const pieces=Array.isArray(value)?value:timeParts(value);pieces.forEach(part=>group.times[i].add(part));});(row.notes||[]).filter(Boolean).forEach(n=>group.notes.add(n));}return [...cards.values()].map(card=>({...card,groups:[...card.groups.values()].map(g=>({...g,times:g.times.map(set=>[...set].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}))),notes:[...g.notes]}))}));});}
function scheduleCard(card,day=''){return `<article class="schedule-slot"><span class="eyebrow">${esc(card.city)}</span><h3>${esc(activityName(card.sport))}</h3>${card.trainer?`<p class="smalltext"><strong>Тренер:</strong> ${esc(card.trainer)}</p>`:''}<p class="smalltext"><strong>Место:</strong> ${esc(card.venue)}</p>${card.event?`<p class="time">${esc(card.dateLabel)}</p><p>${esc(card.description||'')}</p>${link('dept/gto?tab=classes','Как участвовать','btn secondary small')}`:card.groups.map(g=>`<section class="schedule-group">${g.category||g.stage?`<p class="smalltext">${esc(g.category)}${g.stage?' · Группа / этап: '+esc(g.stage):''}</p>`:''}${g.times.map((values,i)=>values.length&&(!day||day===String(i+1))?`<div class="schedule-day"><strong>${shortDays[i]}</strong><div>${values.map(t=>`<span class="schedule-interval">${esc(t)}</span>`).join(' ')}</div></div>`:'').join('')}${g.notes.length?`<p class="smalltext">${g.notes.map(esc).join('; ')}</p>`:''}</section>`).join('')}</article>`;}
function scheduleOriginals(dep,f){return `<div class="panel"><h2>Оригиналы расписания</h2><div class="row">${ext(f.url,'Страница на сайте школы')}${dep==='sport'?ext(sportScheduleData.source,'Расписание PDF'):''}${f.files.map(x=>ext(x.url,'Открыть '+x.format)).join('')}</div>${f.tables.map(t=>`<div class="tablewrap" style="margin-top:16px">${t}</div>`).join('')}${dep==='veterans'?`<div class="image-grid" style="margin-top:16px">${f.images.filter(i=>/расписан|SVO_page/i.test(i.alt+i.src)).map((i,n)=>imageCard(i.src,'Страница '+(n+1),'Оригинал с сайта школы',i.local)).join('')}</div>`:''}</div>`;}
function scheduleView(forceDept){const dep=forceDept||params.get('dept')||'resource',d=dept(dep)||dept('resource'),key=d.schedule,f=feeds[key],q=params.get('q')||'',day=params.get('day')||'',original=params.get('mode')==='original';if(!f)return calendarOriginals(dep);let cards=[],unavailable=false;if(dep==='resource')cards=groupedSchedule(slots());else if(dep==='sport')cards=groupedSchedule(sportScheduleSlots());else if(dep==='veterans'){cards=groupedSchedule(f.scheduleRows||D.feeds.veteransSchedule.scheduleRows||[]);unavailable=!cards.length;}else if(dep==='mustang')cards=groupedSchedule(mustangScheduleSlots());else if(dep==='gto')cards=allEvents().filter(e=>e.ownerDept==='gto').map(e=>({event:true,sport:e.title,city:'',venue:e.place,dateLabel:e.dateLabel,description:e.description,start:e.start}));const visible=cards.filter(c=>(!q||match(JSON.stringify(c),q))&&(!day||c.event||c.groups.some(g=>g.times[Number(day)-1]?.length||g.notes.length)));
return `${!forceDept?head('Расписание','Выберите подразделение, занятие, тренера или площадку.'):''}${!forceDept?`<div class="toolbar">${field('dept','Направление',D.departments.filter(d=>d.schedule).map(d=>[d.id,d.name]),dep,'Выбрать')}</div>`:''}${feedStatus(key)}<div class="row schedule-mode"><button class="chip ${!original?'on':''}" data-param="mode" data-value="cards">Карточки</button><button class="chip ${original?'on':''}" data-param="mode" data-value="original">Оригиналы</button></div>${original?scheduleOriginals(dep,f):`<div class="toolbar" style="margin-top:16px">${filterSearch(q,'Занятие, тренер, площадка или город')}</div>${dep==='gto'?notice('В центре ГТО здесь показан календарь мероприятий. Дату, время и место участия подтвердит организатор.'):`<div class="days">${['Вся неделя',...shortDays].map((name,i)=>`<button class="chip ${day===(i?String(i):'')?'on':''}" data-param="day" data-value="${i||''}">${name}</button>`).join('')}</div>`}${unavailable?notice('Табличное расписание пока недоступно. Откройте оригинал документа; последняя сохранённая версия появится после загрузки данных.'):''}<p class="result-count">Найдено: ${visible.length}${dep==='veterans'&&f.scheduleParsedAt?' · Расписание из документа школы':''}</p><div class="schedule-grid">${visible.map(c=>scheduleCard(c,dep==='gto'?'':day)).join('')||empty('Расписание не найдено','Измените поиск или откройте оригиналы расписания.')}</div>${dep==='veterans'?notice('Дополнительные занятия согласуются с тренером. Условия посещения уточните у специалиста.'):''}`}${sourceLine(f.url)}`;}

function imageCard(src,title,caption,fallback=''){return `<article class="image-card"><button data-image="${esc(src)}" data-fallback="${esc(fallback||'')}" aria-label="Увеличить: ${esc(title)}"><img src="${esc(src)}" ${fallback?`data-fallback-src="${esc(fallback)}"`:''} alt="${esc(title)}" loading="lazy"></button><div class="caption">${esc(title)}<br>${esc(caption)}</div></article>`;}
function calendarOriginals(id){if(id==='all')return ['events','gto','veterans'].map(x=>`<div class="section-head"><h2>${esc(deptName(x))}</h2></div>${calendarOriginals(x)}`).join('');const keys=D.departmentCalendars[id]||[];if(!keys.length)return `<div class="panel"><h2>План этого направления</h2><p>Отдельный календарный план не найден. Уточните даты мероприятий в подразделении.</p>${link('dept/'+id+'?tab=contact','Связаться со своим отделом','btn secondary','phone')}${id==='sport'?link('dept/events?tab=plan','Календарь отдела по организации и проведению мероприятий','btn ghost'):''}</div>`;return `<div class="section-head"><h2>Календарный план и изменения</h2></div>${participationPanel(id,true)}${keys.map(k=>`<section class="panel calendar-source">${feedStatus(k)}${feeds[k].images.length?`<div class="image-grid">${feeds[k].images.map((i,n)=>imageCard(i.src,'Календарь · страница '+(n+1),'Оригинал с сайта школы',i.local)).join('')}</div>`:''}<div class="list">${feeds[k].files.filter(x=>/2026/.test(x.title)).map(x=>docRow({...x,dept:id,owners:[id],kind:'Календарь'})).join('')}</div>${sourceLine(feeds[k].url)}</section>`).join('')}`;}

function savedView(){const acts=D.activities.filter(x=>saved.has(x.id)),events=allEvents().filter(x=>saved.has(x.id)),docs=allDocs().filter(x=>saved.has(x.id)),venues=D.venues.filter(x=>saved.has(x.id));return head('Мои сохранённые','Занятия, события, площадки и файлы, к которым вы хотите вернуться. Выбор хранится в этом браузере.')+(saved.size?`${acts.length?'<div class="section-head"><h2>Занятия</h2></div><div class="grid">'+acts.map(activityCard).join('')+'</div>':''}${events.length?'<div class="section-head"><h2>Мероприятия</h2></div><div class="list">'+events.map(eventCard).join('')+'</div>':''}${venues.length?'<div class="section-head"><h2>Площадки</h2></div><div class="grid two">'+venues.map(venueCard).join('')+'</div>':''}${docs.length?'<div class="section-head"><h2>Документы</h2></div><div class="list">'+docs.map(docRow).join('')+'</div>':''}`:empty('Пока ничего не сохранено','Нажмите значок закладки на занятии, событии, площадке или документе.'))}
function searchView(){let q=params.get('q')||'',a=D.activities.filter(x=>q&&match(JSON.stringify(x),q)),e=allEvents().filter(x=>q&&match(JSON.stringify(x),q)),docs=allDocs().filter(x=>q&&match(x.title,q)),v=D.venues.filter(x=>q&&match(JSON.stringify(x),q));return head('Поиск по приложению',q?'Результаты по запросу «'+q+'»':'Введите название занятия, адрес или вид документа.')+(!q?'':`<div class="section-head"><h2>Занятия · ${a.length}</h2></div><div class="grid">${a.slice(0,12).map(activityCard).join('')}</div><div class="section-head"><h2>Мероприятия · ${e.length}</h2></div><div class="list">${e.slice(0,8).map(eventCard).join('')}</div><div class="section-head"><h2>Документы · ${docs.length}</h2></div><div class="list">${docs.slice(0,15).map(docRow).join('')}</div><div class="section-head"><h2>Площадки · ${v.length}</h2></div><div class="grid two">${v.slice(0,6).map(venueCard).join('')}</div>`);}
function sourcesView(){return head('Источники и обновления','Загружаются только сведения открытого раздела.')+`<section class="panel"><h2>Обновление с сайта школы</h2><p>Фоновая проверка kski.ru выполняется каждые 6 часов. Приложение получает небольшие копии таблиц и списков документов. Изображения и файлы открываются по необходимости.</p><p>Если источник не ответил или формат документа изменился, остаётся последняя успешно обработанная версия. В расписании показываются дата загрузки и статус проверки.</p><p>Карточки отдельных мероприятий и описания услуг сверяются отдельно. Актуальные планы, положения и протоколы смотрите в материалах своего отдела.</p><button type="button" class="btn" data-sync="all">Загрузить последние копии всех источников</button></section><div class="list">${Object.entries(feeds).map(([key,f])=>`<section class="panel"><h3>${esc(({resourceSchedule:'Расписание Ресурсного центра',sportSchedule:'Общее расписание занятий школы',veteransSchedule:'Расписание занятий для участников СВО',veteransCalendar:'Мероприятия для участников СВО',gtoCalendar:'Календарный план Регионального центра ГТО',mustangSchedule:'Расписание КСК «Мустанг»',schoolCalendar:'Календарный план школы',regionCalendar:'Краевой календарный план',gtoRules:'Положения мероприятий ГТО',gtoResults:'Протоколы ГТО',regionResults:'Протоколы краевых соревнований',schoolResults:'Протоколы школьных соревнований',festivalResults:'Протоколы краевых фестивалей',rules2026:'Положения соревнований',jobs:'Вакансии',organization:'Основные сведения об организации'})[key]||'Материалы школы')}</h3>${feedStatus(key)}${ext(f.url,'Источник школы')}</section>`).join('')}</div>`;}
function participationPanel(id,compact=false,eventTitle=''){const d=dept(id)||dept('events'),isGto=id==='gto';const targetTitle=eventTitle||'выбранное мероприятие';return `<section class="participation ${compact?'compact':''}"><div class="participation-heading">${ic('message')}<div><h2>${compact?'Хотите участвовать?':'Как связаться для участия'}</h2><p>${esc(d.name)}</p></div></div>${!compact?`<ol class="steps-text"><li>Выберите ${isGto?'фестиваль или испытание ГТО':'мероприятие в календарном плане'} и прочитайте соответствующее положение.</li><li>Свяжитесь с ${isGto?'региональным центром ГТО':'отделом'}: назовите мероприятие, дату, возраст и количество участников.</li><li>Уточните условия допуска, срок и способ подачи заявки, перечень документов, точное время и площадку.</li></ol>`:`<p>Назовите событие и дату. Уточните условия, документы и срок подачи заявки.</p>`}<div class="row"> <a class="btn" href="tel:${d.phone.replace(/[^\d+]/g,'')}">${ic('phone')} ${esc(d.phone)}</a>${d.email?`<a class="btn secondary" href="mailto:${esc(d.email)}?subject=${encodeURIComponent('Участие: '+targetTitle)}">Написать организатору</a>`:''}${compact?`<button class="btn ghost" data-participate="${id}">Порядок участия →</button>`:''}</div>${!compact?`<p class="smalltext">Участие необходимо согласовать с организатором.</p>`:''}</section>`;}
function admissionActivities(goal){const groups=new Map();for(const activity of D.activities.filter(a=>a.dept===goal)){if(!groups.has(activity.name))groups.set(activity.name,[]);groups.get(activity.name).push(activity);}const chosen=params.get('activity')||'',rows=groups.get(chosen),activity=rows?.[0];const cities=rows?[...new Set(rows.flatMap(a=>a.city.split(';').map(city=>city.trim().replace('Комсомольск-На-Амуре','Комсомольск-на-Амуре'))))]:[],categories=rows?[...new Set(rows.flatMap(a=>a.categories))]:[];const age=goal==='sport'?'Возраст и этап подготовки зависят от программы.':chosen==='Плавание'?'Есть группы с 7 лет и отдельные взрослые группы с 18 лет.':chosen==='Настольный теннис'?'При нарушении слуха — с 8 лет; при нарушении зрения или ПОДА — с 18 лет.':activity?.minAge?'Возраст для записи: от '+activity.minAge+' лет.':'';const scheduleQuery=activity?({r2:'конный',r3:'футбол',r12:'бокс'}[activity.id]||chosen):'';return `<section class="panel admission-activities" aria-labelledby="admission-activities-title"><h2 id="admission-activities-title">Выберите занятие</h2><p>${goal==='resource'?'Оздоровительные занятия Ресурсного центра. Сначала выберите интересующее направление, затем согласуйте пробное посещение.':'Направления отдела по спортивной подготовке. Выберите вид спорта, чтобы посмотреть группы, тренеров и условия записи.'}</p><div class="admission-activity-grid" role="group" aria-label="Выбор занятия">${[...groups.keys()].map(name=>`<button type="button" class="admission-activity-choice" data-param="activity" data-value="${esc(name)}" aria-pressed="${chosen===name}">${ic(chosen===name?'check':goal==='resource'?'heart':'trophy')}<span>${esc(activityName(name))}</span></button>`).join('')}</div>${activity?`<section class="admission-activity-details" aria-live="polite" aria-label="Выбранное занятие"><p class="eyebrow">Выбрано для записи</p><h3>${esc(activityName(chosen))}</h3><p>${esc(goal==='resource'?activity.description:'Регулярные тренировки и участие в соревнованиях. Тренер поможет выбрать подходящую группу.')}</p><p>${ic('pin')} ${esc(cities.join('; '))}</p><p>${esc(age)}</p><div class="tags">${categories.map(category=>tag(categoryLabel(category))).join('')}</div><div class="row">${link('catalog?dept='+goal+'&q='+encodeURIComponent(chosen),'Подробнее о занятиях','btn secondary','info')}${link('schedule?dept='+goal+'&q='+encodeURIComponent(scheduleQuery),'Расписание','btn secondary','calendar')}<button type="button" class="btn" data-admission-documents>Документы для записи ${ic('arrow')}</button></div><p class="smalltext">Группу, наличие мест и условия посещения подтвердит специалист ${goal==='resource'?'Ресурсного центра':'отдела по спортивной подготовке'}.</p></section>`:'<p class="smalltext">Нажмите на название занятия — здесь появятся сведения о направлении и кнопка расписания.</p>'}</section>`;}
function admissionDestination(goal){const d=dept(goal);return `<section class="panel admission-destination" aria-labelledby="admission-destination-title"><h2 id="admission-destination-title">Куда подать документы</h2><p class="destination-department">${esc(d.name)}</p><p class="destination-address">${ic('pin')} ${esc(d.address)}</p><p class="smalltext">Часы работы школы: ${esc(D.officeHours)} · время Хабаровска</p><div class="row"><a class="btn" href="tel:${d.phone.replace(/[^+\d]/g,'')}">${ic('phone')} Позвонить: ${esc(d.phone)}</a>${mapLinks(d.address)}${d.email?`<a class="btn secondary" href="mailto:${esc(d.email)}">Написать специалисту</a>`:''}</div><p class="smalltext">Перед визитом позвоните: специалист подтвердит время приёма и способ передачи документов. ${goal==='resource'?'После пробных занятий сообщите, что хотите продолжать занятия.':'Назовите выбранный вид спорта и согласованный этап подготовки.'}</p></section>`;}

// Keep external websites outside the MAX mini-app frame.
(function(){
 const dialog=document.createElement('dialog');dialog.id='external-link';dialog.setAttribute('aria-label','Открытие внешнего сайта');document.body.appendChild(dialog);
 let selectedUrl='';
 function inMax(){return !!(window.WebApp?.initData||/WebAppData=|WebAppPlatform=/.test(location.search+location.hash)||window.self!==window.top);}
 function openExternal(url){
  if(typeof window.WebApp?.openLink==='function'&&inMax()){window.WebApp.openLink(url);return;}
  const opened=window.open(url,'_blank','noopener,noreferrer');
 }
 function showLink(url){selectedUrl=url;dialog.innerHTML='<button type="button" class="iconbtn" data-external-close aria-label="Закрыть" style="float:right">×</button><h2>Открыть сайт в браузере</h2><p>Ссылка открывается во внешнем браузере. Если переход не произошёл, скопируйте адрес и вставьте его в браузер.</p><label for="external-link-url">Адрес страницы</label><input id="external-link-url" readonly style="display:block;width:100%;padding:12px;margin:12px 0;font-size:16px"><div class="row"><button type="button" class="btn" data-external-open>Открыть в браузере</button><button type="button" class="btn secondary" data-external-copy>Скопировать ссылку</button></div><p role="status" id="external-link-status" class="smalltext"></p>';dialog.querySelector('input').value=url;if(!dialog.open)dialog.showModal();}
 document.addEventListener('click',function(e){
  const target=e.target.closest?.('button,a');if(!target)return;
  if(target.hasAttribute('data-external-close')){dialog.close();return;}
  if(target.hasAttribute('data-external-open')){try{openExternal(selectedUrl);}catch{dialog.querySelector('[role="status"]').textContent='Не удалось открыть автоматически. Скопируйте адрес.';}return;}
  if(target.hasAttribute('data-external-copy')){const input=dialog.querySelector('input'),status=dialog.querySelector('[role="status"]');input.focus();input.select();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(selectedUrl).then(()=>status.textContent='Ссылка скопирована. Вставьте её в адресную строку браузера.',()=>status.textContent='Адрес выделен. Скопируйте его через меню или Ctrl+C.');else status.textContent='Адрес выделен. Скопируйте его через меню или Ctrl+C.';return;}
  if(target.tagName!=='A'||target.hasAttribute('download')||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
  const raw=target.getAttribute('href');if(!raw||raw.startsWith('#'))return;let url;try{url=new URL(raw,location.href);}catch{return;}
  if(!/^https?:$/.test(url.protocol)||url.origin===location.origin||!inMax())return;
  e.preventDefault();e.stopImmediatePropagation();
  // Invoke synchronously during the user's click: required by MAX Bridge.
  showLink(url.href);try{openExternal(url.href);}catch{dialog.querySelector('[role="status"]').textContent='Скопируйте ссылку и откройте её в браузере.';}
 },true);
})();
