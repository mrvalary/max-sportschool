function home(){return `<section class="hero"><div class="hero-copy"><span class="eyebrow">КГАУ ДО «ХКСАШПСР»</span><h1>Спорт объединяет</h1><p>Найдите своё направление: занятия для здоровья, развитие спортсменов, ГТО и соревнования.</p><div class="row">${link('catalog','Выбрать занятия','btn','arrow')}${link('admission','Как начать заниматься','btn secondary','file')}</div></div><div class="hero-media"><img src="${window.EMBEDDED_ASSETS['assets/legacy-hero.jpg']}" alt="Иллюстрация адаптивного спорта из прежней версии приложения"></div></section><div class="task-strip"><a class="task" href="#admission?dept=resource">${ic('heart')}<span>Впервые на занятия<small>Пробные → документы → регулярные</small></span>${ic('chevron')}</a><a class="task" href="#dept/sport">${ic('trophy')}<span>Развиваться в спорте<small>Тренер, подготовка и выступления</small></span>${ic('chevron')}</a><a class="task" href="#dept/events">${ic('calendar')}<span>Участвовать в мероприятии<small>План, положение и связь с отделом</small></span>${ic('chevron')}</a></div><div class="section-head"><h2>Направления школы</h2><span>У каждого свои материалы</span></div><div class="grid">${D.departments.map(directionCard).join('')}</div><div class="section-head"><h2>Полезное рядом</h2></div><div class="grid two">${[['documents?kind=Протокол','file','Протоколы и результаты','Найдите своё мероприятие'],['schedule','clock','Расписание занятий','Выберите своё направление'],['jobs','users','Работа в школе','Вакансии и контакты отдела кадров'],['about','info','Об организации','Наши задачи, адреса и подразделения']].map(([u,i,t,n])=>`<a class="task" href="#${u}">${ic(i)}<span>${t}<small>${n}</small></span>${ic('chevron')}</a>`).join('')}</div><div class="section-head"><h2>Ближайшие по плану</h2>${link('events','Все события','btn ghost')}</div><div class="list">${currentEvents().slice(0,3).map(eventCard).join('')||empty('Новые даты уточняются','Откройте календарь нужного отдела.')}</div><p class="source">Перед посещением подтвердите дату и место у организатора.</p>`;}

function field(name,label,values,current='',emptyLabel='Все'){return `<div class="field"><label for="f-${name}">${esc(label)}</label><select id="f-${name}" data-filter="${name}"><option value="">${emptyLabel}</option>${values.map(v=>{let [value,title]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(title)}</option>`;}).join('')}</select></div>`;}
function filterSearch(q,placeholder='Название, тренер или адрес'){return `<div class="field search"><label for="f-q">Поиск</label><input id="f-q" data-filter="q" value="${esc(q||'')}" placeholder="${esc(placeholder)}"></div>`;}
function catalog(forceDept){let dep=forceDept||params.get('dept')||'',q=params.get('q')||'',cat=params.get('category')||'',city=params.get('city')||'',age=params.get('age')||'';
 let list=D.activities.filter(a=>(!dep||a.dept===dep||dep==='mustang'&&a.name==='Адаптивная верховая езда'||dep==='veterans'&&a.categories.includes('СВО'))&&(!q||match(JSON.stringify(a),q))&&(!cat||a.categories.includes(cat))&&(!city||match(a.city,city))&&(!age||!a.minAge||((a.id==='r13'&&['ПОДА','Нарушение зрения'].includes(cat))?18:a.minAge)<=Number(age)));
 return `${!forceDept?head('Занятия под вашу цель','Выберите оздоровительные занятия или спортивную подготовку. Фильтры помогают сузить выбор; зачисление согласует специалист.'):''}<div class="toolbar">${filterSearch(q)}${!forceDept?field('dept','Цель / направление',[['resource','Здоровье и оздоровление'],['sport','Спортивная подготовка'],['mustang','Верховая езда'],['veterans','Ветеранам СВО']],dep):''}${field('category','Категория',['ЛИН','ПОДА','Нарушение слуха','Нарушение зрения','ЦП','СВО'],cat)}${field('city','Город',['Хабаровск','Комсомольск-на-Амуре','Бикин','Советская Гавань','Пивань','Амурск','Ванино'],city)}<div class="field"><label for="f-age">Возраст участника</label><input id="f-age" type="number" min="0" max="110" data-filter="age" placeholder="Лет" value="${esc(age)}"></div></div><p class="result-count">Найдено записей: ${list.length}. В спортивной подготовке записи разделены по тренерам и площадкам.</p>${age?notice('Возрастной фильтр учитывает только опубликованный минимум. Для отдельных категорий требования отличаются; откройте карточку.'):''}<div class="grid">${list.slice(0,pageNo*30).map(activityCard).join('')}</div>${!list.length?empty('Занятия по этим фильтрам не найдены','Измените фильтры или обратитесь в Ресурсный центр.'):''}${list.length>pageNo*30?'<div class="row" style="margin-top:20px"><button class="btn secondary" data-more>Показать ещё</button></div>':''}${dep==='resource'?`<div class="row" style="margin-top:20px">${link('admission?dept=resource','Сначала пробные занятия — как начать','btn','arrow')}</div>`:dep==='veterans'?notice('Группы для ветеранов внесены из опубликованного DOCX. Оригиналы доступны в расписании.'):''}${sourceLine(dep==='sport'?dept('sport').source:dep==='veterans'?dept('veterans').source:dept('resource').source)}`;
}
function activityCard(a){return `<article class="card"><div class="type">${esc(a.type)}</div>${saveButton(a.id)}<h3>${esc(a.name)}</h3><div class="tags">${a.categories.map(x=>tag(x)).join('')}${a.minAge?tag('от '+a.minAge+' лет','teal'):tag('Возраст — по программе')}</div><p>${esc(a.description)}</p><div class="meta">${ic('pin')}${esc(a.city)}</div><div class="row"><button class="btn secondary small" data-activity="${a.id}">Подробнее</button>${link('schedule?dept='+a.dept+'&q='+encodeURIComponent(a.trainer||({r2:'конный',r3:'футбол',r12:'бокс'}[a.id]||a.name)),'Расписание','btn ghost')}</div></article>`;}
function showActivity(id){const a=D.activities.find(x=>x.id===id),d=dept(a.dept);modal(`<span class="eyebrow">${esc(d.name)}</span><h2>${esc(a.name)}</h2><div class="tags">${a.categories.map(x=>tag(x)).join('')}</div><p>${esc(a.description)}</p><p class="smalltext">${esc(a.city)} · ${a.minAge?'Минимальный возраст: '+a.minAge+' лет.':'Минимальный возраст зависит от программы и этапа.'}</p>${a.name==='Настольный теннис'&&a.dept==='resource'?notice('Для лиц с нарушением слуха — с 8 лет; с нарушением зрения и ПОДА — с 18 лет.'):''}${a.name==='Плавание'&&a.dept==='resource'?notice('На сайте отдельно приведены группы с 7 лет и взрослые группы с 18 лет. Конкретную группу подбирает специалист.'):''}<div class="row">${link('schedule?dept='+a.dept+'&q='+encodeURIComponent(a.trainer||({r2:'конный',r3:'футбол',r12:'бокс'}[a.id]||a.name)),'Посмотреть расписание','btn','calendar')}${a.dept==='veterans'?link('dept/veterans?tab=about','Условия поддержки','btn secondary'):`<button class="btn secondary" data-checklist="${a.dept}">Порядок и документы</button>`}</div><div class="panel" style="margin-top:18px"><h3>Обсудить занятия со специалистом</h3><a class="contact-link" href="tel:${d.phone.replace(/[^+\d]/g,'')}">${esc(d.phone)}</a><p>${esc(d.address)}</p></div>${sourceLine(a.source)}${a.ageSource?sourceLine(a.ageSource):''}`);}
function eventCard(e){const start=e.start?new Date(e.start+'T12:00:00'):null;let day=start?start.getDate():'↗',mon=start?start.toLocaleDateString('ru-RU',{month:'short'}):'календарь';let old=e.end&&e.end<dayNow();return `<article class="event"><div class="date-badge"><strong>${day}</strong>${esc(mon.replace('.',''))}</div><div class="event-body"><h3><button class="btn ghost" style="font-size:inherit;text-align:left;padding:0;color:var(--ink);display:block" data-event="${e.id}">${esc(e.title)}</button></h3><div class="meta">${ic('calendar')}${esc(e.dateLabel)}</div><div class="meta">${ic('pin')}${esc(e.place)}</div><div class="tags">${tag(deptName(e.ownerDept||e.depts[0]),'teal')}${e.status==='results'?tag('Есть протокол','result'):old?tag('По прошедшему плану'):tag('По календарному плану')}${e.dateConflict?tag('Даты требуют уточнения','warn'):''}</div></div>${saveButton(e.id)}</article>`;}
function allEvents(){let list=D.events.map(x=>({...x}));const f=feeds.gtoCalendar;if(f?.live&&f.tables.length){const tb=new DOMParser().parseFromString(f.tables[0],'text/html').querySelector('table');if(tb){const rows=[...tb.rows].map(r=>[...r.cells].map(c=>c.textContent.trim())).filter(r=>r.length>=5&&/^\d+$/.test(r[0]));list=list.filter(x=>!/^g\d+$/.test(x.id));for(const r of rows){const original=D.events.find(x=>x.id==='g'+r[0]),dates=parseRussianDate(r[3]);list.push({...original,id:'g'+r[0],title:r[1],dateLabel:r[3]+' 2026',place:r[4],start:dates[0],end:dates[1],depts:['gto'],ownerDept:'gto',documentIds:original?.documentIds||[],categories:original?.categories||['Все категории'],source:f.url,status:'plan',description:r[2]});}}}return list;}

function parseRussianDate(s){let y=(s.match(/20\d{2}/)||['2026'])[0],months=['январ','феврал','март','апрел','мая','июн','июл','август','сентябр','октябр','ноябр','декабр'];let raw=s.replace(/20\d{2}/g,'');let nums=[...raw.matchAll(/\d+/g)].map(x=>Number(x[0])).filter(x=>x<=31&&x>0),ms=[];for(let m=0;m<12;m++)if(raw.toLowerCase().includes(months[m]))ms.push([raw.toLowerCase().indexOf(months[m]),m+1]);ms.sort((a,b)=>a[0]-b[0]);if(!nums.length||!ms.length)return ['',''];let fmt=(d,m)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return [fmt(nums[0],ms[0][1]),fmt(nums[1]||nums[0],ms.at(-1)[1])];}
function eventsView(forceDept){const dep=forceDept||params.get('dept')||'',when=params.get('when')||'upcoming',q=params.get('q')||'';const list=allEvents().filter(e=>(!dep||e.ownerDept===dep)&&(!q||match(JSON.stringify(e),q))&&(when==='all'||when==='past'&&e.end&&e.end<dayNow()||when==='upcoming'&&(e.end>=dayNow()||!e.start))).sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'));return `${!forceDept?head('Мероприятия по отделам','Выберите организатора: его календарь, положения и протоколы остаются в одном разделе.'):''}<div class="toolbar">${filterSearch(q,'Название события или вид спорта')}${!forceDept?field('dept','Отдел / направление',D.departments.map(d=>[d.id,d.name]),dep):''}${field('when','Период',[['upcoming','Ближайшие'],['past','Прошедшие'],['all','Все опубликованные']],when,'Выбрать')}</div>${dep?participationPanel(dep,true):`<div class="row" style="margin-bottom:18px">${link('dept/events?tab=events','Соревнования школы','btn secondary small')}${link('dept/gto?tab=events','Мероприятия ГТО','btn secondary small')}</div>`}<p class="result-count">Карточек: ${list.length}. Полные планы и изменения — ниже в оригиналах.</p><div class="list">${list.map(eventCard).join('')||empty('Отдельные карточки не опубликованы в прототипе',dep?'Уточните план у своего отдела. Ниже доступны только его опубликованные оригиналы.':'Измените период или выберите организатора.')}</div>${!forceDept?calendarOriginals(dep||'all'):''}`;}

function showEvent(id){const e=allEvents().find(x=>x.id===id);if(!e)return;const owner=e.ownerDept||e.depts[0],docs=allDocs().filter(d=>(e.documentIds||[]).includes(d.id));modal(`<span class="eyebrow">${esc(deptName(owner))}</span><h2>${esc(e.title)}</h2><p>${ic('calendar')} ${esc(e.dateLabel)}</p><p>${ic('pin')} ${esc(e.place)}</p><div class="tags">${e.categories.map(x=>tag(x)).join('')}</div><p>${esc(e.description||'')}</p>${e.dateConflict?notice('В источниках расходятся даты. Подтвердите дату у своего отдела.','warn'):''}${participationPanel(owner,false,e.title)}<div class="section-head"><h2>Материалы этого события</h2></div><div class="list">${docs.map(docRow).join('')}</div>${!docs.some(x=>x.kind==='Положение')?notice('Отдельное положение к этой карточке пока не привязано. Запросите его у организатора; используйте только положение выбранного мероприятия.'):''}<div class="row" style="margin-top:16px">${ext(e.source,'Страница публикации')}<button class="btn secondary small" data-ics="${e.id}">Добавить дату в календарь</button></div>`);}

function deptView(id){const d=dept(id);if(!d)return empty('Раздел не найден');const tab=params.get('tab')||'about',isEvents=id==='events',isGto=id==='gto';const tabs=isEvents?[['about','Обзор'],['events','Мероприятия'],['plan','Календарный план'],['rules','Положения'],['results','Протоколы'],['contact','Как участвовать']]:[['about','Обзор'],['classes',isGto?'Как участвовать':'Занятия и услуги'],['schedule',isGto?'Календарь ГТО':'Расписание'],['events','Мероприятия'],['venues','Площадки'],['docs','Документы'],['contact','Контакты']];let content='';if(tab==='about')content=`<div class="split"><section class="panel"><h2>Чем можем помочь</h2><ul class="service-list">${d.services.map(t=>`<li>${ic('check')}<span>${esc(t)}</span></li>`).join('')}</ul><div class="row">${id==='resource'?link('admission?dept=resource','Пробные занятия и документы','btn','arrow'):id==='sport'?link('admission?dept=sport','Порядок зачисления спортсмена','btn','trophy'):link('dept/'+id+'?tab='+('events'===id?'plan':'classes'),isEvents?'Открыть план':isGto?'Как участвовать':'Выбрать услугу','btn','arrow')}${!isEvents?link('dept/'+id+'?tab=schedule',isGto?'Календарь ГТО':'Расписание','btn secondary','calendar'):link('dept/events?tab=results','Протоколы','btn secondary','file')}</div>${id==='sport'?notice('Цель отдела — развитие спортсменов, подготовка спортивного резерва и спортсменов высокого класса. Вид спорта, программу и этап подбирают с тренером.','success'):''}${id==='resource'?admissionSteps('resource',true):''}</section><aside>${contactPanel(d)}</aside></div>${sourceLine(d.source)}`;
if(tab==='classes')content=isGto?gtoGuide():id==='mustang'?priceView():catalog(id);
if(tab==='schedule')content=scheduleView(id);
if(tab==='events')content=eventsView(id)+calendarOriginals(id);
if(tab==='plan')content=calendarOriginals(id);
if(tab==='rules')content=documentsView(id,'Положение');
if(tab==='results')content=documentsView(id,'Протокол');
if(tab==='venues')content=venuesView(id);
if(tab==='docs')content=documentsView(id);
if(tab==='contact')content=(isEvents?participationPanel(id):'')+contactPanel(d)+sourceLine(D.contactsSource);
return `<div class="dept-banner"><div class="tile-icon ${d.color}">${ic(d.icon)}</div><div><span class="eyebrow">${esc(d.eyebrow)}</span><h1>${esc(d.name)}</h1><p>${esc(d.description)}</p></div></div><div class="tabs" role="tablist" aria-label="Разделы направления">${tabs.map(([t,l])=>`<button role="tab" aria-selected="${t===tab}" class="${t===tab?'active':''}" data-tab="${t}">${l}</button>`).join('')}</div>${content}`;}

function gtoGuide(){const norms=D.documents.filter(x=>x.kind==='Нормативы'&&x.format!=='САЙТ');return `<div class="panel"><h2>Начните с официальных источников ГТО</h2><p>Правовые документы и нормативы — на официальном сайте ВФСК ГТО. Календарь и связь с региональным центром — в этом разделе.</p><div class="grid two">${D.gtoOfficial.map(x=>`<a class="task" href="${esc(x.url)}" target="_blank" rel="noopener">${ic('external')}<span>${esc(x.title)}<small>${esc(x.description)} · gto.ru</small></span></a>`).join('')}</div></div><div class="section-head"><h2>Порядок участия</h2></div>${participationPanel('gto')}<div class="row">${ext('https://kski.ru/content/podrazdeleniya/vfsk-gto/registraciya-rebyonka-na-sajte-gto/','Инструкция регистрации ребёнка')}${link('dept/gto?tab=events','Календарь центра ГТО','btn secondary')}</div><div class="section-head"><h2>Материалы регионального центра</h2></div><p class="smalltext">Ниже — копии нормативов, опубликованные школой. Актуальную редакцию проверяйте по официальным ссылкам выше.</p><div class="list">${norms.map(docRow).join('')}</div>`;}

function priceView(){return `<div class="panel"><h3>Услуги «Мустанга»</h3><p>Опубликованный перечень на 01.06.2026. Стоимость и доступность услуги подтвердите у клуба перед посещением.</p><div class="tablewrap" style="border:0;max-height:none"><table class="prices"><thead><tr><th>Услуга</th><th>Стоимость</th><th>Условия</th></tr></thead><tbody>${D.prices.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.price===null?'По номиналу':money(p.price)}</td><td>${esc(p.note)}</td></tr>`).join('')}</tbody></table></div>${sourceLine(D.prices[0].source)}<div class="row" style="margin-top:15px">${link('dept/mustang?tab=schedule','Расписание клуба','btn secondary')}${link('dept/mustang?tab=contact','Согласовать посещение','btn')}</div></div>`;}
function contactPanel(d){return `<div class="panel"><h3>${esc(d.name)}</h3><a class="contact-link" href="tel:${d.phone.replace(/[^\d+]/g,'')}">${esc(d.phone)}</a>${d.phone2?`<a class="smalltext" href="tel:${d.phone2.replace(/[^\d+]/g,'')}">${esc(d.phone2)}</a>`:''}<p>${esc(d.address)}</p>${d.email?`<p><a href="mailto:${esc(d.email)}">${esc(d.email)}</a></p>`:''}<p class="smalltext">${d.id==='mustang'?'Время посещения и занятий согласуйте с клубом.':esc(D.officeHours)+' · время Хабаровска'}</p><div class="row">${ext(mapUrl(d.address),'Построить маршрут')}${ext(D.contactsSource,'На сайте школы')}</div></div>`;}
function contactsView(){return `${head('Контакты отделов','По занятиям, соревнованиям и ГТО обращайтесь к специалисту своего направления.')}<div class="grid two">${D.departments.map(contactPanel).join('')}</div><div class="row" style="margin-top:20px">${link('jobs','Отдел кадров и вакансии','btn secondary','users')}${link('admission','Документы и зачисление','btn secondary','file')}</div>${sourceLine(D.contactsSource)}`;}

function mapUrl(address,city=''){return 'https://yandex.ru/maps/?text='+encodeURIComponent(city+' '+address);}
function venueCard(v){return `<article class="card"><div class="venue-map">${ic('pin')}</div>${saveButton(v.id)}<h3>${esc(v.name)}</h3><p>${esc(v.city)}, ${esc(v.address)}</p><div class="tags">${v.sports.map(s=>tag(s)).join('')}</div><p class="smalltext">Условия доступности входа и сопровождения уточните у специалиста перед посещением.</p><div class="row">${ext(mapUrl(v.address,v.city),'Маршрут')}${link('schedule?q='+encodeURIComponent(v.address.split(',')[0]),'Расписание','btn ghost')}</div>${sourceLine(v.source)}</article>`;}
function venuesView(forceDept){let q=params.get('q')||'',list=D.venues.filter(v=>(!q||match(JSON.stringify(v),q))&&(!forceDept||v.depts.includes(forceDept)||forceDept==='mustang'&&v.name.includes('Мустанг')||forceDept==='resource'&&v.id==='office'));return `${!forceDept?head('Где проходят занятия','Площадки из реестра тренеров школы. Для физкультурно-оздоровительных групп адрес также указан в их расписании.'):''}<div class="toolbar">${filterSearch(q,'Площадка, адрес или вид спорта')}</div>${forceDept==='gto'?notice('Постоянное место всех испытаний ГТО на сайте не задано. Площадка зависит от мероприятия; точный адрес сообщает центр.'):''}${forceDept==='resource'?notice('Площадки физкультурно-оздоровительных групп взяты из расписания Ресурсного центра. У одного объекта могут быть несколько групп и инструкторов.'):''}<p class="result-count">Площадок: ${list.length}</p><div class="grid two">${list.map(venueCard).join('')||empty('Уточните площадку у отдела','Адрес конкретного мероприятия или занятия приведён в расписании и положении.')}</div>`;}
function allDocs(){let docs=D.documents.map(x=>({...x}));for(const [key,f] of Object.entries(feeds)){if(!f.live)continue;const owner=D.feedOwners[key]||'events',kind=key.includes('Results')?'Протокол':key.includes('Rules')||key==='rules2026'?'Положение':key.includes('Calendar')?'Календарь':'Расписание';for(const x of f.files){const exists=docs.find(d=>d.url===x.url);if(exists){exists.title=x.title;exists.source=f.url;if(owner==='gto'){exists.dept='gto';exists.owners=['gto'];}}else docs.push({...x,id:'live-'+key+'-'+docs.length,dept:owner,owners:key==='sportSchedule'?['sport','resource']:[owner],kind,source:f.url});}}return docs;}

function docRow(d){const indexed=allDocs().find(x=>x.url===d.url);d={...indexed,...d};if(!d.id)d.id='url-'+encodeURIComponent(d.url);const owners=d.owners||[d.dept||'events'],owner=owners[0],participate=['Календарь','Положение','Протокол'].includes(d.kind);return `<article class="docrow"><span class="docicon">${esc(d.format||'ФАЙЛ')}</span><div class="docbody"><h3>${esc(d.title)}</h3><div class="tags">${tag(d.kind||'Документ')}${tag(owners.map(deptName).join(' · '))}</div><div class="source">${ext(d.source,'Страница публикации','')}</div></div>${ext(d.local||d.url,d.local?'Открыть копию':'Открыть файл')}${saveButton(d.id)}${participate?`<div class="doc-contact"><a href="tel:${dept(owner).phone.replace(/[^\d+]/g,'')}">${ic('phone')} ${esc(dept(owner).phone)}</a><button class="btn ghost" data-participate="${owner}">Как участвовать →</button></div>`:''}</article>`;}

function documentsView(forceDept,forceKind){const q=params.get('q')||'',kind=forceKind||params.get('kind')||'',dep=forceDept||params.get('dept')||'';const list=allDocs().filter(d=>(!q||match(JSON.stringify(d),q))&&(!kind||d.kind===kind)&&(!dep||(d.owners||[d.dept]).includes(dep)));return `${!forceDept?head('Результаты и документы','Материалы разделены по отделу и типу. У каждого файла указан его источник.'):''}<div class="toolbar">${filterSearch(q,'Соревнование или название файла')}${!forceKind?field('kind','Тип документа',['Протокол','Положение','Календарь','Нормативы','Правовые акты','Награждение','Расписание','Бланк','Программа','Услуги','Инструкция'],kind):''}${!forceDept?field('dept','Отдел / направление',D.departments.map(d=>[d.id,d.name]),dep):''}</div>${dep&&['events','gto'].includes(dep)&&(!kind||['Календарь','Положение','Протокол'].includes(kind))?participationPanel(dep,true):''}<p class="result-count">Файлов: ${list.length}. ${dep?'Материалы выбранного отдела.':'Выберите отдел, чтобы увидеть его материалы.'}</p><div class="list">${list.slice(0,pageNo*25).map(docRow).join('')||empty('Материалы не выделены отдельной публикацией','Свяжитесь со своим отделом для уточнения.')}</div>${list.length>pageNo*25?'<div style="margin-top:20px"><button class="btn secondary" data-more>Показать ещё</button></div>':''}`;}

function expandTable(table){let result=[],spans=new Map();[...table.rows].forEach((row,r)=>{let cols=[],c=0;[...row.cells].forEach(cell=>{while(spans.has(r+','+c)){cols[c]=spans.get(r+','+c);c++;}let text=cell.innerText??cell.textContent;let v=text.replace(/\s+/g,' ').trim();let cs=cell.colSpan||1,rs=cell.rowSpan||1;for(let cc=0;cc<cs;cc++){cols[c]=v;for(let rr=1;rr<rs;rr++)spans.set((r+rr)+','+c,v);c++;}});while(spans.has(r+','+c)){cols[c]=spans.get(r+','+c);c++;}result.push(cols);});return result;}
function slots(){let out=[],sport='',city='Хабаровск';feeds.resourceSchedule.tables.forEach((html,ti)=>{let t=new DOMParser().parseFromString(html,'text/html').querySelector('table');if(!t)return;let rows=expandTable(t);if(ti===1)city='Комсомольск-на-Амуре';for(let r of rows){let uniq=[...new Set(r.filter(Boolean))];if(uniq.length===1){let s=uniq[0];if(s.startsWith('г.'))city=s.replace('г. ','');else if(s.startsWith('БИКИН')||s.includes('Бикин'))city='Бикин';else sport=s;continue;}if(r.length>=11&&r[1]&&!r[1].toLowerCase().includes('тренер')){let s=ti===0?sport:r[3].split('(')[0].trim();let times=r.slice(4,11);if(times.some(t=>/индивидуальн/i.test(t)))times=['По индивидуальному графику','','','','','',''];out.push({sport:s,trainer:r[1],venue:r[2],category:r[3],times,city});}}});return out;}
function feedStatus(key){const f=feeds[key];return `<div class="feedbar"><span>${syncErrors[key]?'<span class="feed-error">Не удалось обновить. Показана сохранённая копия.</span>':f.live?'Загружено с сайта: '+esc(new Date(f.fetchedAt).toLocaleString('ru-RU',{timeZone:'Asia/Vladivostok'})):'Сохранённая копия · '+D.checkedDate}${f.cached?' · источник временно недоступен':''}</span><button class="btn secondary small" data-sync="${key}">${ic('refresh')} Обновить с сайта</button></div>`;}
function scheduleView(forceDept){let dep=forceDept||params.get('dept')||'resource',d=dept(dep)||dept('resource'),key=d.schedule,f=feeds[key],mode=params.get('mode')||'',q=params.get('q')||'',day=params.get('day')||'';let content='';if(!f)return calendarOriginals(dep);
 if(dep==='resource'){
  const raw=slots();let list=raw.filter(r=>(!q||match(JSON.stringify(r),q))&&(!day||r.times[Number(day)-1]||r.times.some(t=>/индивидуальн/i.test(t))));
  content=`<div class="row"><button class="chip ${mode!=='original'?'on':''}" data-param="mode" data-value="cards">Удобный список</button><button class="chip ${mode==='original'?'on':''}" data-param="mode" data-value="original">Таблица с сайта</button></div>${mode==='original'?f.tables.map(t=>`<div class="tablewrap" style="margin:16px 0">${t}</div>`).join(''):`<div class="toolbar" style="margin-top:15px">${filterSearch(q,'Направление, тренер, площадка или город')}</div><div class="days">${['Вся неделя','Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((n,i)=>`<button class="chip ${day===(i?String(i):'')?'on':''}" data-param="day" data-value="${i||''}">${n}</button>`).join('')}</div><p class="result-count">Строк расписания: ${list.length}. Сохраняются все опубликованные временные интервалы.</p><div class="schedule-grid">${list.map(r=>`<article class="schedule-slot"><span class="eyebrow">${esc(r.city)}</span><h3>${esc(r.sport)}</h3><p class="smalltext">${esc(r.trainer)}<br>${esc(r.venue)}<br>${esc(r.category)}</p>${r.times.some(t=>/индивидуальн/i.test(t))?`<p class="time">По индивидуальному графику</p>`:r.times.map((time,i)=>time&&(!day||day===String(i+1))?`<div class="meta"><strong>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</strong><span class="time">${esc(time)}</span></div>`:'').join('')}</article>`).join('')||empty('Строки не найдены')}</div>`}`;
 }else if(dep==='sport'){
  const file=f.files.filter(x=>/2026/.test(x.title)).at(-1)||f.files.at(-1);content=`${notice('Оригинал общего расписания тренеров-преподавателей и инструкторов на 2026 год. В нём есть разделы спортивной подготовки и Ресурсного центра. Страницы ниже — резервная копия документа от 15.04.2026; свежий оригинал открывается кнопкой.')}${file?`<div class="row">${ext(file.url,'Открыть актуальный PDF с сайта')}${file.local?ext(file.local,'Скачать сохранённый PDF'):''}</div>`:''}${q?notice('Вы искали: '+q+'. В PDF используйте поиск браузера (Ctrl+F).'):''}<div class="section-head"><h2>Страницы сохранённого расписания</h2><span>13 страниц · нажмите для увеличения</span></div><div class="image-grid">${D.sportPdfPages.map((src,i)=>imageCard(src,'Страница '+(i+1),'Локальная копия PDF')).join('')}</div>`;
 }else if(dep==='veterans'){
  let images=f.images.filter(i=>/расписан/i.test(i.alt)||/SVO_page/i.test(i.src));content=`${notice('Картинки загружаются с kski.ru; при ошибке показывается резервная копия. На странице также опубликован DOCX от октября 2026: при расхождениях сверьтесь с ним и уточните время у специалиста.')}<div class="image-grid">${images.map((i,n)=>imageCard(i.src,'Расписание ветеранов СВО · страница '+(n+1),'Оригинальное изображение kski.ru',i.local)).join('')}</div><div class="row" style="margin-top:18px">${f.files.map(x=>ext(x.url,'Скачать расписание '+x.format)).join('')}</div>${calendarOriginals(dep)}`;
 }else if(dep==='gto')content=eventsView('gto')+`<div class="section-head"><h2>Оригинальная таблица центра ГТО</h2></div>`+f.tables.map(t=>`<div class="tablewrap">${t}</div>`).join('')+f.files.map(docRow).join('');
 else content=notice('Адаптивная верховая езда — по индивидуальному графику. Дни и часы других занятий приведены ниже в исходной таблице клуба.')+f.tables.map(t=>`<div class="tablewrap">${t}</div>`).join('')+`<div class="row" style="margin-top:18px">${link('dept/mustang?tab=contact','Согласовать время занятия','btn','phone')}</div>`;
 return `${!forceDept?head('Расписание и календари','Регулярные занятия и мероприятия разделены. Выберите своё направление.'):''}${!forceDept?`<div class="toolbar">${field('dept','Направление',D.departments.filter(d=>d.schedule).map(d=>[d.id,d.name]),dep,'Выбрать')}</div>`:''}${feedStatus(key)}${content}${sourceLine(f.url)}`;
}
function imageCard(src,title,caption,fallback=''){return `<article class="image-card"><button data-image="${esc(src)}" data-fallback="${esc(fallback||'')}" aria-label="Увеличить: ${esc(title)}"><img src="${esc(src)}" ${fallback?`data-fallback-src="${esc(fallback)}"`:''} alt="${esc(title)}" loading="lazy"></button><div class="caption">${esc(title)}<br>${esc(caption)}</div></article>`;}
function calendarOriginals(id){if(id==='all')return ['events','gto','veterans'].map(x=>`<div class="section-head"><h2>${esc(deptName(x))}</h2></div>${calendarOriginals(x)}`).join('');const keys=D.departmentCalendars[id]||[];if(!keys.length)return `<div class="panel"><h2>План этого направления</h2><p>Отдельный календарный план ${esc(deptName(id))} в проверенных публикациях не выделен. Уточните мероприятия непосредственно в своём подразделении.</p>${link('dept/'+id+'?tab=contact','Связаться со своим отделом','btn secondary','phone')}${id==='sport'?link('dept/events?tab=plan','Календарь отдела проведения мероприятий','btn ghost'):''}</div>`;return `<div class="section-head"><h2>Календарный план и изменения</h2></div>${participationPanel(id,true)}${keys.map(k=>`<section class="panel calendar-source">${feedStatus(k)}${feeds[k].images.length?`<div class="image-grid">${feeds[k].images.map((i,n)=>imageCard(i.src,'Календарь · страница '+(n+1),'Оригинал с сайта школы',i.local)).join('')}</div>`:''}<div class="list">${feeds[k].files.filter(x=>/2026/.test(x.title)).map(x=>docRow({...x,dept:id,owners:[id],kind:'Календарь'})).join('')}</div>${sourceLine(feeds[k].url)}</section>`).join('')}`;}

function savedView(){const acts=D.activities.filter(x=>saved.has(x.id)),events=allEvents().filter(x=>saved.has(x.id)),docs=allDocs().filter(x=>saved.has(x.id)),venues=D.venues.filter(x=>saved.has(x.id));return head('Мои сохранённые','Занятия, события, площадки и файлы, к которым вы хотите вернуться. Выбор хранится в этом браузере.')+(saved.size?`${acts.length?'<div class="section-head"><h2>Занятия</h2></div><div class="grid">'+acts.map(activityCard).join('')+'</div>':''}${events.length?'<div class="section-head"><h2>Мероприятия</h2></div><div class="list">'+events.map(eventCard).join('')+'</div>':''}${venues.length?'<div class="section-head"><h2>Площадки</h2></div><div class="grid two">'+venues.map(venueCard).join('')+'</div>':''}${docs.length?'<div class="section-head"><h2>Документы</h2></div><div class="list">'+docs.map(docRow).join('')+'</div>':''}`:empty('Пока ничего не сохранено','Нажмите значок закладки на занятии, событии, площадке или документе.'))}
function searchView(){let q=params.get('q')||'',a=D.activities.filter(x=>q&&match(JSON.stringify(x),q)),e=allEvents().filter(x=>q&&match(JSON.stringify(x),q)),docs=allDocs().filter(x=>q&&match(x.title,q)),v=D.venues.filter(x=>q&&match(JSON.stringify(x),q));return head('Поиск по приложению',q?'Результаты по запросу «'+q+'»':'Введите название занятия, адрес или вид документа.')+(!q?'':`<div class="section-head"><h2>Занятия · ${a.length}</h2></div><div class="grid">${a.slice(0,12).map(activityCard).join('')}</div><div class="section-head"><h2>Мероприятия · ${e.length}</h2></div><div class="list">${e.slice(0,8).map(eventCard).join('')}</div><div class="section-head"><h2>Документы · ${docs.length}</h2></div><div class="list">${docs.slice(0,15).map(docRow).join('')}</div><div class="section-head"><h2>Площадки · ${v.length}</h2></div><div class="grid two">${v.slice(0,6).map(venueCard).join('')}</div>`);}
function sourcesView(){return head('Источники и обновления','Проверено '+D.checkedDate+'. Данные и документы школы — на kski.ru; интерфейс и маршруты предложены для нового приложения.')+`<div class="panel"><h3>Как обновляются расписания</h3><p>Изображения открываются с исходного сайта, при ошибке — из архива. Кнопка обновления получает свежую страницу через локальный сервер. Успешно загруженные таблицы и ссылки сохраняются в этом браузере. При ошибке последняя копия остаётся доступной.</p><p>В общем расписании PDF актуальная версия открывается с сайта; миниатюры — резервная копия от 15.04.2026. Карточки школьных и краевых мероприятий — проверенные примеры, их даты не извлекаются автоматически из сканированных PDF. Все изменения календарей открываются отдельно.</p><button class="btn" data-sync="all">Обновить источники</button>${location.protocol==='file:'?notice('Для обновления HTML-таблиц запустите Kski.Local.exe из архива или сервер из исходников. В режиме файла доступны сохранённые данные и онлайн-картинки.','warn'):''}</div><div class="section-head"><h2>Проверенные разделы · ${D.sources.length}</h2></div><div class="list">${D.sources.map(s=>`<div class="docrow"><div class="docbody"><h3>${esc(s.title)}</h3><span class="smalltext">Документов на странице: ${s.fileCount} · изображений: ${s.images}</span></div>${ext(s.url,'Источник')}</div>`).join('')}</div>`;}

function participationPanel(id,compact=false,eventTitle=''){const d=dept(id)||dept('events'),isGto=id==='gto';const targetTitle=eventTitle||'выбранное мероприятие';return `<section class="participation ${compact?'compact':''}"><div class="participation-heading">${ic('message')}<div><h2>${compact?'Хотите участвовать?':'Как связаться для участия'}</h2><p>${esc(d.name)}</p></div></div>${!compact?`<ol class="steps-text"><li>Выберите ${isGto?'фестиваль или испытание ГТО':'мероприятие в календарном плане'} и прочитайте соответствующее положение.</li><li>Свяжитесь с ${isGto?'региональным центром ГТО':'отделом'}: назовите мероприятие, дату, возраст и количество участников.</li><li>Уточните условия допуска, срок и способ подачи заявки, перечень документов, точное время и площадку.</li></ol>`:`<p>Назовите событие и дату. Уточните условия, документы и срок подачи заявки.</p>`}<div class="row"> <a class="btn" href="tel:${d.phone.replace(/[^\d+]/g,'')}">${ic('phone')} ${esc(d.phone)}</a>${d.email?`<a class="btn secondary" href="mailto:${esc(d.email)}?subject=${encodeURIComponent('Участие: '+targetTitle)}">Написать в отдел</a>`:''}${compact?`<button class="btn ghost" data-participate="${id}">Порядок участия →</button>`:''}</div>${!compact?`<p class="smalltext">Пока заявка не согласована с организатором, наличие записи в плане не подтверждает допуск.</p>`:''}</section>`;}
function admissionSteps(goal,compact=false){const sports=goal==='sport';const steps=sports?[['Выберите вид спорта','Обсудите с отделом цель, тренера и подходящий этап спортивной подготовки.'],['Подготовьте и подайте документы','Согласуйте список документов и порядок выполнения требований программы.'],['Развивайтесь как спортсмен','После зачисления занимайтесь по расписанию и программе своего этапа.']]:[['Придите на пробные занятия','Свяжитесь с Ресурсным центром и согласуйте дату, площадку и условия первого посещения.'],['Если понравилось — подайте документы','Подготовьте пакет по своей категории и уточните у центра способ подачи.'],['Переходите к регулярным занятиям','После оформления посещайте занятия в согласованной группе.']];return `<div class="admission-steps ${compact?'compact':''}">${steps.map(([title,text],i)=>`<div class="step"><span class="step-num">${i+1}</span><div><h3>${title}</h3><p>${text}</p></div></div>`).join('')}</div>`;}
function admissionView(){const goal=params.get('dept')==='sport'?'sport':'resource',d=dept(goal),c=D.checklists[goal],category=params.get('category')||'',items=[...c.items];if(goal==='resource'&&category==='ЛИН')items.push('Справка об обучении или окончании учебного заведения по соответствующей программе','Полностью заполненный бланк теста Векслера, включая субтесты','Справка психиатра, подтверждающая диагноз');return `${head('Документы и зачисление','Порядок зависит от цели: оздоровительные занятия или развитие спортсмена.')}<div class="goal-switch">${[['resource','Для здоровья и оздоровления','heart'],['sport','Для развития в спорте','trophy']].map(([v,n,i])=>`<button class="goal-option ${goal===v?'on':''}" data-param="dept" data-value="${v}">${ic(i)}${n}</button>`).join('')}</div>${admissionSteps(goal)}<div class="split"><div><section class="panel"><h2>${goal==='resource'?'Шаг 1. Согласовать пробные занятия':'Шаг 1. Обсудить спортивную подготовку'}</h2><p>${goal==='resource'?'Сначала попробуйте выбранное направление. Дату, место, формат пробного занятия и условия посещения согласуйте с Ресурсным центром. К подготовке полного пакета переходите, если захотите продолжать.':'Отдел занимается развитием спортсменов. Сотрудник поможет выбрать вид спорта, тренера, программу и этап. Требования к возрасту, отбору и документам зависят от программы.'}</p><div class="row"><a class="btn" href="tel:${d.phone.replace(/[^\d+]/g,'')}">${ic('phone')} ${esc(d.phone)}</a>${link('catalog?dept='+goal,'Посмотреть направления','btn secondary')}</div></section><section class="panel" style="margin-top:16px"><h2>Шаг 2. Подготовить и подать документы</h2>${goal==='resource'?`<div class="toolbar">${field('category','Категория',['ЛИН','ПОДА','Нарушение слуха','Нарушение зрения'],category,'Выберите категорию')}</div>`:''}<p class="smalltext">Список для самопроверки. Отмечайте готовые документы — без загрузки их содержимого.</p><ul class="checklist">${items.map((text,i)=>`<li><label><input type="checkbox" data-check="${goal}-${i}"><span>${esc(text)}</span></label></li>`).join('')}</ul>${goal==='resource'&&category!=='ЛИН'?notice('Для лиц с интеллектуальными нарушениями требуются дополнительные документы. Выберите «ЛИН» или откройте полный перечень.'):''}<p class="smalltext">${esc(c.extra)}</p><div class="submission-box"><h3>Куда подать</h3><p>${esc(d.name)}<br>${esc(d.address)}</p><p>Уточните у специалиста время приёма и допустимый способ передачи документов. ${goal==='resource'?'После пробных занятий сообщите, что хотите продолжать занятия.':'Сообщите выбранный вид спорта и согласованный с отделом этап подготовки.'}</p><a href="tel:${d.phone.replace(/[^\d+]/g,'')}" class="btn secondary">Уточнить подачу документов</a></div><div class="row" style="margin-top:16px">${ext(c.source,'Полный официальный перечень')}${goal==='sport'?ext('https://kski.ru/content/o-shkole/dokuments/dokumenty-dlya-zachisleniya/sportivno-ozdorovitelnyj-etap/','Спортивно-оздоровительный этап'):''}</div></section><section class="panel" style="margin-top:16px"><h2>Шаг 3. Начать регулярные занятия</h2><p>После оформления согласуйте группу, тренера и расписание со специалистом.</p>${link('schedule?dept='+goal,'Открыть расписание','btn','calendar')}</section></div><aside>${contactPanel(d)}</aside></div>`;}
function jobsView(){const j=D.jobs,f=feeds.jobs;return `${head('Вакансии','Работа в спортивно-адаптивной школе. Предложения и контакты отдела кадров.')}${feedStatus('jobs')}${notice('Должности и суммы — из сохранённой публикации школы от '+D.checkedDate+'. Наличие вакансий и условия уточните в отделе кадров.')}<div class="grid">${j.items.map(x=>`<article class="card job-card"><div class="tile-icon blue">${ic('users')}</div>${x.positions?tag(x.positions+' мест в публикации','teal'):''}<h2>${esc(x.name)}</h2><div class="salary">${money(x.salary)}<small>Зарплата по публикации школы</small></div><p>${esc(x.schedule)}</p><button class="btn" data-job="${x.id}">Как откликнуться ${ic('arrow')}</button></article>`).join('')}</div><div class="split" style="margin-top:20px"><section class="panel"><h2>Условия и требования</h2><ul class="service-list">${j.conditions.map(x=>`<li>${ic('check')}<span>${esc(x)}</span></li>`).join('')}</ul><h3>Требования из публикации</h3><ul class="smalltext">${j.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="smalltext">В общем описании указан график 5/2, 09:00–18:00; для конюха отдельно — сутки через трое. График конкретной должности подтвердит отдел кадров.</p></section><aside class="panel"><h2>Отдел кадров</h2><a class="contact-link" href="tel:+74212304960">${esc(j.phone)}</a><a href="mailto:${j.email}">${j.email}</a><p>${esc(j.address)}</p><button class="btn secondary" data-copy="${j.email}">Скопировать почту</button>${ext(j.source,'Вакансии на сайте')}</aside></div>${f.live?`<details class="panel" style="margin-top:18px"><summary>Свежая публикация школы</summary><div class="source-text">${esc(f.text)}</div></details>`:''}${sourceLine(j.source)}`;}
function jobDialog(id){const job=D.jobs.items.find(x=>x.id===id);if(!job)return;const email=D.jobs.email,subject='Резюме: '+job.name;modal(`<span class="eyebrow">Отдел кадров</span><h2>${esc(job.name)}</h2><ol class="steps-text"><li>Подготовьте резюме.</li><li>Укажите должность «${esc(job.name)}» в теме письма.</li><li>Отправьте резюме на почту школы или позвоните, чтобы уточнить условия.</li></ol><div class="copy-box"><strong>${email}</strong><button class="btn secondary small" data-copy="${email}">Скопировать адрес</button></div><div class="row"><a class="btn" href="mailto:${email}?subject=${encodeURIComponent(subject)}">Открыть почту</a><a class="btn secondary" href="tel:+74212304960">${ic('phone')} ${D.jobs.phone}</a></div><p class="smalltext">Если почта не открылась внутри мессенджера, скопируйте адрес и отправьте письмо из своего почтового приложения.</p>`);}
function settingsPanel(){return `<section class="panel settings-panel"><div><h2>Оформление</h2><p>Зимний эффект из прежней версии. Выбор сохранится на этом устройстве.</p></div><label class="theme-switch"><input type="checkbox" id="winter-toggle" aria-label="Зимний эффект" ${winterEnabled?'checked':''}><span></span></label><p class="smalltext">При системной настройке уменьшения движения анимации и снег отключаются.</p></section>`;}
function aboutView(){const o=D.organization;return `${head('Об организации','Хабаровская краевая спортивно-адаптивная школа')}<section class="panel about-intro"><span class="eyebrow">${esc(o.short)}</span><h2>${esc(o.name)}</h2><p>Школа объединяет оздоровительные занятия, развитие спортсменов и организацию адаптивных спортивных мероприятий.</p><div class="grid two">${o.goals.map((x,i)=>`<div class="about-purpose"><span class="step-num">${i+1}</span><p>${esc(x)}</p></div>`).join('')}</div></section><div class="section-head"><h2>Чем занимаются подразделения</h2></div><div class="grid">${D.departments.map(directionCard).join('')}</div><div class="section-head"><h2>Адреса и сведения</h2></div><div class="grid two"><section class="panel"><h3>Приём посетителей</h3><p>${esc(o.actualAddress)}</p><p>${esc(D.officeHours)}</p>${ext(mapUrl(o.actualAddress),'Построить маршрут')}${link('contacts','Контакты отделов','btn secondary small')}</section><section class="panel"><h3>Школа</h3><p>Основана: ${esc(o.founded)}<br>Директор: ${esc(o.director)}</p><p>Юридический адрес: ${esc(o.legalAddress)}</p><p class="smalltext">${esc(o.founder)}</p>${ext(o.source,'Основные сведения на сайте')}</section></div><div class="row" style="margin:20px 0">${link('jobs','Работать в школе','btn','users')}${link('admission','Начать заниматься','btn secondary','heart')}</div>${settingsPanel()}${sourceLine(o.source)}`;}
let revealObserver=null;
function observeReveals(){revealObserver?.disconnect();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const els=[...document.querySelectorAll('#view .direction,#view .card,#view .event,#view .panel,#view .task,#view .docrow,#view .step')];if(!('IntersectionObserver' in window))return;revealObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){e.target.classList.add('revealed');revealObserver.unobserve(e.target);}},{threshold:.05,rootMargin:'0px 0px 30px 0px'});els.forEach((el,i)=>{el.classList.add('reveal-ready');el.style.setProperty('--reveal-delay',Math.min(i%3,2)*45+'ms');revealObserver.observe(el);});}
let winterEnabled=false;try{winterEnabled=localStorage.getItem('max-sportschool-winter-theme')==='on';}catch{}
function applyWinter(){document.body.classList.toggle('winter-theme',winterEnabled);let layer=document.getElementById('winter-snowfall');if(!layer){layer=document.createElement('div');layer.id='winter-snowfall';layer.className='winter-snowfall';layer.setAttribute('aria-hidden','true');document.body.prepend(layer);}layer.replaceChildren();if(winterEnabled&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<18;i++){const snow=document.createElement('span');snow.className='winter-snowflake';snow.style.cssText=`--x:${(i*37+9)%100}%;--size:${3+i*7%6}px;--duration:${10+i*11%11}s;--delay:${-(i*13%20)}s;--drift:${(i%2?1:-1)*(15+i*7%40)}px`;layer.append(snow);}try{localStorage.setItem('max-sportschool-winter-theme',winterEnabled?'on':'off');}catch{}}
function bindNewControls(){const toggle=document.getElementById('winter-toggle');if(toggle)toggle.onchange=()=>{winterEnabled=toggle.checked;applyWinter();};document.querySelectorAll('[data-check]').forEach(el=>{try{el.checked=localStorage.getItem('kski-check-'+el.dataset.check)==='1';}catch{}el.onchange=()=>{try{localStorage.setItem('kski-check-'+el.dataset.check,el.checked?'1':'0');}catch{}};});}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast('Скопировано');}catch{modal(`<h2>Скопировать текст</h2><p>Выделите и скопируйте адрес:</p><input class="copy-input" readonly value="${esc(value)}" aria-label="Адрес для копирования">`);}}

function render(){const hash=(location.hash||'#home').slice(1);const [p,query]=hash.split('?');let old=route;route=p||'home';params=new URLSearchParams(query||'');shell();let html='';if(route==='home')html=home();else if(route==='catalog')html=catalog();else if(route==='schedule')html=scheduleView();else if(route==='events')html=eventsView();else if(route==='venues')html=venuesView();else if(route==='documents')html=documentsView();else if(route==='saved')html=savedView();else if(route==='contacts')html=contactsView();else if(route==='admission')html=admissionView();else if(route==='jobs')html=jobsView();else if(route==='about')html=aboutView();else if(route==='sources')html=sourcesView();else if(route==='search')html=searchView();else if(route==='more')html=settingsPanel()+head('Все разделы','Направления школы и полезные сервисы.')+`<div class="panel">${Object.entries(paths).filter(([k])=>!['more','search','home'].includes(k)).map(([k,n])=>`<a class="route-link" href="#${k}">${esc(n)} →</a>`).join('')}</div><div class="section-head"><h2>Направления</h2></div><div class="grid">${D.departments.map(directionCard).join('')}</div>`;else if(route.startsWith('dept/'))html=deptView(route.split('/')[1]);else html=empty('Раздел не найден','Перейдите на главную страницу.');$('#view').innerHTML=html;bindFilters();bindImages();bindNewControls();observeReveals();document.title=(route.startsWith('dept/')?deptName(route.split('/')[1]):paths[route]||'Адаптивный спорт')+' · ХКСАШПСР';}
function setParam(k,v){const scroll=window.scrollY;if(v)params.set(k,v);else params.delete(k);pageNo=1;history.replaceState(null,'','#'+route+(params.size?'?'+params.toString():''));render();window.scrollTo(0,scroll);}
function bindFilters(){document.querySelectorAll('[data-filter]').forEach(el=>{if(el.tagName==='SELECT')el.onchange=()=>setParam(el.dataset.filter,el.value);else{el.onchange=()=>setParam(el.dataset.filter,el.value);el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();setParam(el.dataset.filter,el.value);}};}});}
function bindImages(){document.querySelectorAll('img[data-fallback-src]').forEach(img=>{img.onerror=()=>{img.onerror=null;if(img.dataset.fallbackSrc)img.src=img.dataset.fallbackSrc;};});}
function modal(content){$('#modal').innerHTML=`<button class="iconbtn close" data-close aria-label="Закрыть">${ic('close')}</button>${content}`;if(!$('#modal').open)$('#modal').showModal();bindImages();}
function checklist(id){const goal=id==='sport'?'sport':'resource';modal(`<h2>Документы и зачисление</h2>${admissionSteps(goal,true)}${link('admission?dept='+goal,'Открыть порядок и полный список','btn','arrow')}`);}

function downloadIcs(id){let e=allEvents().find(x=>x.id===id);if(!e?.start)return toast('В источнике нет точной даты — добавление недоступно.');let end=new Date(e.end+'T12:00:00');end.setDate(end.getDate()+1);let dt=s=>s.replaceAll('-','');let escapeIcs=s=>String(s).replaceAll('\\','\\\\').replaceAll('\n','\\n').replaceAll(',','\\,').replaceAll(';','\\;');let txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kski//Local Prototype//RU','BEGIN:VEVENT','UID:'+e.id+'-2026@kski.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+dt(e.start),'DTEND;VALUE=DATE:'+dt(end.toISOString().slice(0,10)),'SUMMARY:'+escapeIcs(e.title+' (по плану, уточнить)'),'LOCATION:'+escapeIcs(e.place),'DESCRIPTION:'+escapeIcs(e.dateLabel+'\nДата требует подтверждения у организатора.\n'+e.source),'END:VEVENT','END:VCALENDAR'].join('\r\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='kski-event.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function help(text=''){let q=text.toLowerCase(),answer='Выберите задачу или напишите, что ищете. Помощник подскажет нужный раздел.',href='catalog',label='Подобрать занятия';if(/ваканс|работа|трудоустр/.test(q)){answer='В разделе «Вакансии» есть опубликованные предложения, условия и способы связи с отделом кадров.';href='jobs';label='Открыть вакансии';}else if(/пробн|документ|запис|зачис/.test(q)&&!/гто/.test(q)){answer='В Ресурсном центре порядок такой: пробные занятия → если направление подходит, подача документов → регулярные занятия после оформления. Для спортивной подготовки есть отдельный путь спортсмена.';href='admission';label='Порядок и документы';}else if(/гто/.test(q)){answer='По вопросам испытаний, документов и знаков отличия ГТО обращайтесь в региональный центр: +7 (909) 800-57-14. В разделе ГТО собраны нормативы, календарь, результаты и приказы.';href='dept/gto';label='Открыть центр ГТО';}else if(/результат|протокол/.test(q)){answer='Протоколы собраны в разделе «Результаты и документы». Можно найти документ по названию соревнования и выбрать направление.';href='documents?kind=Протокол';label='Найти протокол';}else if(/сво|ветеран/.test(q)){answer='Для ветеранов СВО есть отдельный маршрут: занятия, опубликованные меры поддержки и консультации центра на Муравьева-Амурского, 54. Подбор занятий: +7 (999) 080-48-52.';href='dept/veterans';label='Ветеранам СВО';}else if(/верхов|мустанг|конн|лошад/.test(q)){answer='В КСК «Мустанг» есть адаптивная верховая езда, обучение, экскурсии и услуги клуба. Занятия проходят на Ясной, 1А. Согласовать посещение: +7 (914) 540-02-03.';href='dept/mustang';label='Открыть «Мустанг»';}else if(/распис|когда/.test(q)){answer='Откройте расписание и выберите направление. У Ресурсного центра есть фильтр по дням и поиск по тренеру или адресу; расписание ветеранов СВО показано оригинальными картинками.';href='schedule';label='Открыть расписание';}else if(/профессион|подготов|тренер/.test(q)){answer='Для систематических тренировок и спортивных достижений выберите «Спортивная подготовка». Контакт отдела: +7 (4212) 31-14-77.';href='dept/sport';label='Спортивная подготовка';}else if(/документ|запис|зачис/.test(q)){answer='Перечень документов зависит от цели: оздоровительные группы или спортивная подготовка. Сначала выберите занятие, затем откройте «Что нужно для зачисления». Вакантные места необходимо уточнить в отделе.';}else if(/где|адрес|площад/.test(q)){answer='Адрес зависит от занятия и группы. В разделе «Площадки» есть адреса, виды спорта и ссылка на маршрут. Для физкультурно-оздоровительных групп смотрите также расписание Ресурсного центра.';href='venues';label='Найти площадку';}else if(/мероприят|соревн|фестив/.test(q)){answer='В календаре можно выбрать направление и период. В карточке мероприятия находятся дата по плану, площадка, контакты и ссылка на первоисточник.';href='events';label='Посмотреть мероприятия';}
 $('#helper').innerHTML=`<button class="iconbtn close" data-close-helper aria-label="Закрыть">${ic('close')}</button><h2>Помочь с выбором</h2><p class="smalltext">Навигатор по информации школы</p><div class="answer">${esc(answer)}</div><div style="margin-top:15px">${link(href,label,'btn small','arrow')}</div><div class="tags">${['Как записаться?','Расписание','Документы для ГТО','Где занимаются?','Найти протокол'].map(q=>`<button class="chip" data-question="${q}">${q}</button>`).join('')}</div><form id="help-form"><input name="question" aria-label="Ваш вопрос" placeholder="Например: хочу заниматься плаванием"><button class="btn small" type="submit" aria-label="Задать вопрос">${ic('arrow')}</button></form>`;$('#help-form').onsubmit=e=>{e.preventDefault();help(new FormData(e.target).get('question'));};if(!$('#helper').open)$('#helper').showModal();}
function sanitizeTable(table){const allowed=new Set(['TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','BR','P','STRONG','B','SPAN']);function copy(n){if(n.nodeType===3)return document.createTextNode(n.textContent);if(n.nodeType!==1||!allowed.has(n.tagName))return document.createTextNode(n.textContent||'');const el=document.createElement(n.tagName.toLowerCase());for(let k of ['rowspan','colspan'])if(n.hasAttribute(k))el.setAttribute(k,String(Math.max(1,Math.min(100,Number(n.getAttribute(k))||1))));for(let c of n.childNodes)el.append(copy(c));return el;}return copy(table).outerHTML;}
function parseFeed(key,r){const doc=new DOMParser().parseFromString(r.html,'text/html'),block=doc.querySelector('.container-fluid.py-3');if(!block)throw Error('Структура источника изменилась');let url=feeds[key].url,imgs=[...block.querySelectorAll('img[src]')].map(i=>{let src=new URL(i.getAttribute('src'),url).href;if(!src.startsWith('https://kski.ru/'))return null;return {src,alt:i.getAttribute('alt')||'',local:D.assetMap[src]};}).filter(Boolean),tables=[...block.querySelectorAll('table')].map(sanitizeTable),files=[...block.querySelectorAll('a[href]')].map(a=>{let u=new URL(a.getAttribute('href'),url).href;if(!u.startsWith('https://kski.ru/media/')||! /\.(pdf|docx?|xlsx?)(\?|$)/i.test(u))return null;let title=(a.closest('p,li,td')||a).textContent.trim().replace(/\(?скачать[\s\S]*$/i,'').trim();if(title.length<5||(a.closest('p,li,td')?.querySelectorAll('a').length||0)>1)title=decodeURIComponent(new URL(u).pathname.split('/').at(-1)).replace(/\.[^.]+$/,'');return {title,url:u,local:D.assetMap[u],source:url,format:u.split('.').at(-1).toUpperCase()};}).filter(Boolean);
 if(['resourceSchedule','mustangSchedule','gtoCalendar'].includes(key)&&!tables.length)throw Error('В источнике нет ожидаемой таблицы');if(key==='veteransSchedule'&&!imgs.some(i=>/расписан|SVO_page/i.test(i.alt+i.src)))throw Error('В источнике не найдены изображения расписания');return {key,url,text:block.textContent.trim(),tables,files:[...new Map(files.map(x=>[x.url,x])).values()],images:imgs,fetchedAt:r.fetchedAt,cached:r.cached,live:true};}
async function sync(key,quiet=false){if(location.protocol==='file:'){if(!quiet)modal(`<h2>Обновление с сайта</h2><p>Оригинальные картинки открываются с kski.ru уже сейчас. Чтобы обновить HTML-таблицы и ссылки автоматически, запустите Kski.Local.exe из распакованного архива.</p><p class="smalltext">Без запуска сервера доступны все сохранённые страницы прототипа и резервные расписания.</p>${ext(feeds[key]?.url||D.sourceSite,'Открыть сайт-источник')}`);return;}
 const keys=key==='all'?Object.keys(feeds):[key];document.querySelectorAll('[data-sync]').forEach(b=>b.disabled=true);if(!quiet)toast('Загружаю сведения с kski.ru…');let ok=0;for(let i=0;i<keys.length;i+=4){await Promise.all(keys.slice(i,i+4).map(async k=>{try{const res=await fetch('/api/source/'+encodeURIComponent(k));if(!res.ok)throw Error('HTTP '+res.status);const r=await res.json();const next=parseFeed(k,r);feeds[k]=next;delete syncErrors[k];ok++;}catch{syncErrors[k]=true;}}));}try{localStorage.setItem('kski-feeds',JSON.stringify({version:2,feeds}));}catch{}lastSync=new Date();const y=window.scrollY;const active=document.activeElement,edit=active?.matches('input')?{id:active.id,value:active.value}:null;render();if(edit?.id&&document.getElementById(edit.id)){const el=document.getElementById(edit.id);el.value=edit.value;el.focus({preventScroll:true});}window.scrollTo(0,y);if(!quiet)toast(`Обновлено источников: ${ok} из ${keys.length}.`);}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('#main').setAttribute('tabindex','-1');$('#main').focus();return;}let b=e.target.closest('[data-save]');if(b){const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);persist();const y=window.scrollY;render();window.scrollTo(0,y);return;}b=e.target.closest('[data-activity]');if(b)return showActivity(b.dataset.activity);b=e.target.closest('[data-event]');if(b)return showEvent(b.dataset.event);b=e.target.closest('[data-tab]');if(b)return setParam('tab',b.dataset.tab);b=e.target.closest('[data-param]');if(b)return setParam(b.dataset.param,b.dataset.value);b=e.target.closest('[data-sync]');if(b)return sync(b.dataset.sync);b=e.target.closest('[data-ics]');if(b)return downloadIcs(b.dataset.ics);b=e.target.closest('[data-image]');if(b)return modal(`<h2>Оригинал расписания / календаря</h2><p class="smalltext">Прокрутите изображение или откройте его отдельно для увеличения.</p>${ext(b.dataset.image,'Открыть изображение')}<img class="full" src="${esc(b.dataset.image)}" ${b.dataset.fallback?`data-fallback-src="${esc(b.dataset.fallback)}"`:''} alt="Страница расписания или календарного плана">`);b=e.target.closest('[data-checklist]');if(b)return checklist(b.dataset.checklist);if(e.target.closest('[data-close]'))return $('#modal').close();if(e.target.closest('[data-close-helper]'))return $('#helper').close();if(e.target.closest('[data-helper]'))return help();b=e.target.closest('[data-question]');if(b)return help(b.dataset.question);b=e.target.closest('[data-participate]');if(b)return modal(`<h2>Как участвовать</h2>${participationPanel(b.dataset.participate)}`);b=e.target.closest('[data-job]');if(b)return jobDialog(b.dataset.job);b=e.target.closest('[data-copy]');if(b)return copyText(b.dataset.copy);if(e.target.closest('[data-more]')){pageNo++;let y=window.scrollY;render();window.scrollTo(0,y);return;}if(e.target.closest('[data-a11y]')){readable=!readable;document.body.classList.toggle('readable',readable);try{localStorage.setItem('kski-readable',readable?'1':'0');}catch{}render();}});
for(const dialog of [$('#modal'),$('#helper')])dialog.addEventListener('click',e=>{if(e.target===dialog){let r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
window.addEventListener('hashchange',()=>{pageNo=1;$('#modal').close();$('#helper').close();render();window.scrollTo(0,0);});
applyWinter();
render();
if(location.protocol!=='file:')fetch('/api/health').then(r=>r.json()).then(x=>{if(x.local)sync('all',true);}).catch(()=>{});
</script></body></html>
